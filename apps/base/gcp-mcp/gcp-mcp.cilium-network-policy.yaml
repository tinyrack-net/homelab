apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-gcp-mcp
  namespace: gcp-mcp-system
spec:
  # Only Bifrost talks to the gateways. Egress to Google APIs and the npm
  # registry is public and covered by the isolated-namespaces policy.
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: gcp-mcp-system
      app: gcp-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
