# Sources for DBHub. Passwords come from dbhub-secrets via ${VAR}.
# A source without [[tools]] entries gets execute_sql (read-write, no row
# cap) and search_objects. Declare [[tools]] only to change that, e.g.
# readonly = true; see dbhub.namespace.yaml.

[[sources]]
id = "personal"
description = "Personal data (personal-data cluster, database personal). The same tables are edited by hand in Mathesar at tables.intranet.winetree94.com; organise topics as schemas."
dsn = "postgres://mcp_agent:${PERSONAL_DB_PASSWORD}@personal-data-database-cluster-rw.personal-data-system.svc.cluster.local:5432/personal?sslmode=disable"
query_timeout = 60
pool_max_connections = 5
