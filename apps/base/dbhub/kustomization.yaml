apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - dbhub.namespace.yaml
  - dbhub.secrets.yaml
  - dbhub.deployment.yaml
  - dbhub.service.yaml
  - dbhub.ingress-route.yaml
  - dbhub.cilium-network-policy.yaml
  - dbhub.traefik.cilium-network-policy.yaml
# A config change gets a new name hash and rolls the Deployment, which also
# picks up new password variables from dbhub-secrets.
configMapGenerator:
  - name: dbhub-config
    namespace: dbhub-system
    files:
      - dbhub.toml
