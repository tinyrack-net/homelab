# Internal only (LAN and VPN via *.intranet.winetree94.com); no Cloudflare
# route. Serves the MCP endpoint (/mcp) and the Workbench (/), both behind
# the bearer token.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dbhub
  namespace: dbhub-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dbhub.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: dbhub
          port: 8080
  tls:
    secretName: letsencrypt-cert
