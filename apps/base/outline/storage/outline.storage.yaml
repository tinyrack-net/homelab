# Outline keeps attachments with FILE_STORAGE=local. The local directory is a
# JuiceFS volume whose data chunks live in the Garage bucket
# tinyrack-homelab-outline-storage (reached only through the internal
# storage.intranet endpoint) and whose metadata lives in the juicefs schema of
# the Outline database. Browsers never talk to Garage directly.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: outline-juicefs
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: outline-juicefs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: outline-system
  csi.storage.k8s.io/node-publish-secret-name: outline-juicefs-secret
  csi.storage.k8s.io/node-publish-secret-namespace: outline-system
mountOptions:
  - cache-dir=/var/lib/jfs-cache
  - cache-size=10240
  - free-space-ratio=0.2
  - buffer-size=100
  - put-timeout=3600
  - max-uploads=2
  - upload-delay=10s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-data
  namespace: outline-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    storage.tinyrack.net/profile: outline
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: outline-juicefs
  volumeMode: Filesystem
