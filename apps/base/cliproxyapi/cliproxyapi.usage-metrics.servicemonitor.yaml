apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cliproxyapi-usage-metrics
  namespace: cliproxyapi-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cliproxyapi-usage-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
