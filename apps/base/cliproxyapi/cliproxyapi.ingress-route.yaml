apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cliproxyapi-internal
  namespace: cliproxyapi-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cliproxyapi.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: cliproxyapi-service
          port: 8317
  tls:
    secretName: letsencrypt-cert
