apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cliproxyapi-database-backup-store
  namespace: cliproxyapi-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/cliproxyapi/database-17
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cliproxyapi-database-backup-store-pg18
  namespace: cliproxyapi-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/cliproxyapi/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cliproxyapi-database-cluster
  namespace: cliproxyapi-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:e81844c6d409b1b45b75e7419758978a2761a7a7ee42aeb4aeadbc26e214c908
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: cliproxyapi-database-backup-store-pg18
        serverName: cliproxyapi-database-pg18
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  enableSuperuserAccess: true
  superuserSecret:
    name: cliproxyapi-database-superuser-secret
  bootstrap:
    initdb:
      database: cliproxyapi
      owner: cliproxyapi
      secret:
        name: cliproxyapi-database-user-secret
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: cliproxyapi-backup
  namespace: cliproxyapi-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: cliproxyapi-database-cluster
