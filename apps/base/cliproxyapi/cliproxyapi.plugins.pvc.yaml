apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cliproxyapi-plugins
  namespace: cliproxyapi-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app: cliproxyapi
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/longhorn-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn-strict-local
  volumeMode: Filesystem
