apiVersion: apps/v1
kind: Deployment
metadata:
  name: cliproxyapi
  namespace: cliproxyapi-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cliproxyapi
  template:
    metadata:
      labels:
        app: cliproxyapi
        observability.tinyrack.net/otlp-client: "true"
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: copy-bootstrap-config
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["sh", "-c", "cp /bootstrap/config.yaml /config/config.yaml"]
          volumeMounts:
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: writable-config
              mountPath: /config
      containers:
        - name: cliproxyapi
          image: eceasy/cli-proxy-api:v7.3.16@sha256:ca6af8b19642b3176eaa6b6ed197cf870a9f8026d1b58693d3ff2a4d7faaedf3
          imagePullPolicy: IfNotPresent
          command:
            - /CLIProxyAPI/CLIProxyAPI
          args:
            - --config
            - /config/config.yaml
          ports:
            - name: http
              containerPort: 8317
              protocol: TCP
          env:
            - name: PGSTORE_LOCAL_PATH
              value: /var/lib/cliproxyapi
            - name: MANAGEMENT_STATIC_PATH
              value: /var/lib/cliproxyapi/static
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://monitoring-trace-sampler.monitoring-system.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: cliproxyapi
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production,service.version=v7.3.16
            - name: OTEL_SDK_DISABLED
              value: "false"
          envFrom:
            - secretRef:
                name: cliproxyapi-secrets
          volumeMounts:
            - name: writable-config
              mountPath: /config
            - name: runtime-data
              mountPath: /var/lib/cliproxyapi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
        - name: usage-exporter
          image: python:3.14-alpine@sha256:4677924bcc0e94505a3270e87cb1601c2af54cd92d021b8dc306618a14333bbe
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /app/collector.py
          ports:
            - name: metrics
              containerPort: 9101
              protocol: TCP
          env:
            - name: MANAGEMENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cliproxyapi-secrets
                  key: MANAGEMENT_PASSWORD
            - name: CLIPROXYAPI_MANAGEMENT_URL
              value: http://127.0.0.1:8317
            - name: EXPORTER_PORT
              value: "9101"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: usage-exporter
              mountPath: /app
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: bootstrap-config
          configMap:
            name: cliproxyapi-bootstrap-config
        - name: writable-config
          emptyDir: {}
        - name: runtime-data
          emptyDir: {}
        - name: usage-exporter
          configMap:
            name: cliproxyapi-usage-exporter
