apiVersion: v1
kind: Service
metadata:
  name: cliproxyapi-usage-metrics
  namespace: cliproxyapi-system
  labels:
    app.kubernetes.io/name: cliproxyapi-usage-metrics
    app.kubernetes.io/component: usage-metrics
spec:
  selector:
    app: cliproxyapi
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
      protocol: TCP
