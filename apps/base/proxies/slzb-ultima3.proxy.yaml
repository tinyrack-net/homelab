apiVersion: v1
kind: Namespace
metadata:
  name: slzb-ultima3-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: slzb-ultima3-proxy-service
  namespace: slzb-ultima3-proxy
spec:
  type: ExternalName
  ports:
    - name: console
      port: 80
  externalName: 10.132.245.48
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: slzb-ultima3-ingress-route
  namespace: slzb-ultima3-proxy
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`slzb-ultima3.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: slzb-ultima3-proxy-service
          kind: Service
          port: 80
  tls:
    secretName: letsencrypt-cert
