apiVersion: v1
kind: Namespace
metadata:
  name: xeon-proxmox-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: xeon-proxmox-proxy-service
  namespace: xeon-proxmox-proxy
spec:
  type: ExternalName
  ports:
    - name: console
      port: 8006
  externalName: 10.132.245.40
---
# Proxmox 의 self signed certification 검증 생략
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: xeon-proxmox-transport
  namespace: xeon-proxmox-proxy
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xeon-proxmox-ingress-route
  namespace: xeon-proxmox-proxy
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`xeon.proxmox.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: xeon-proxmox-proxy-service
          kind: Service
          port: 8006
          serversTransport: xeon-proxmox-transport
          scheme: https
  tls:
    secretName: letsencrypt-cert
