apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-photos
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: photos
  annotations:
    networking.tinyrack.net/hosts: photos.winetree94.com
spec:
  description: Allow the photos.winetree94.com route and Immich OAuth discovery
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich-system
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich-system
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
