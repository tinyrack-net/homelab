apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: proxy-macmini-nanokvm
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: traefik-system
      app.kubernetes.io/name: traefik
  egress:
    - toCIDR:
        - 10.132.245.43/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
