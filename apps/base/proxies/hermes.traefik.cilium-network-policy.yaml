apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-hermes
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: hermes
  annotations:
    networking.tinyrack.net/hosts: hermes.intranet.winetree94.com
spec:
  description: Allow the hermes.intranet.winetree94.com route to the Hermes Webapp on the Windows desktop
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toCIDRSet:
        - cidrGroupRef: desktop
      toPorts:
        - ports:
            - port: "9120"
              protocol: TCP
