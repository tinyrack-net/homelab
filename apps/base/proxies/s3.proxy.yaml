# VersityGW S3 gateway running in Docker on OpenMediaVault.
# - storage.intranet and <bucket>.storage.intranet: S3 API (3900)
# - s3.intranet: VersityGW web UI (3909) and its admin API under /admin (3903)
apiVersion: v1
kind: Namespace
metadata:
  name: s3-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: s3-proxy-service
  namespace: s3-proxy
spec:
  type: ExternalName
  ports:
    - port: 3900
      name: api
    - port: 3903
      name: admin
    - port: 3909
      name: console
  externalName: 10.132.245.8
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3-api-ingress-route
  namespace: s3-proxy
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostRegexp(`^(.+\.)?storage\.intranet\.winetree94\.com$`)
      kind: Rule
      services:
        - name: s3-proxy-service
          kind: Service
          port: 3900
  tls:
    secretName: letsencrypt-cert
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: s3-console-ingress-route
  namespace: s3-proxy
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3.intranet.winetree94.com`) && PathPrefix(`/admin`)
      kind: Rule
      services:
        - name: s3-proxy-service
          kind: Service
          port: 3903
    - match: Host(`s3.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: s3-proxy-service
          kind: Service
          port: 3909
  tls:
    secretName: letsencrypt-cert
