apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: proxy-proxmox
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: traefik-system
      app.kubernetes.io/name: traefik
  egress:
    - toCIDR:
        - 10.132.244.24/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
