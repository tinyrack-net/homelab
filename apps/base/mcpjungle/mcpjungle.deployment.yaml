apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcpjungle
  namespace: mcpjungle-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mcpjungle
  template:
    metadata:
      labels:
        app: mcpjungle
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcpjungle
          # The stdio image bundles node/npx and uv/uvx for stdio MCP servers.
          image: ghcr.io/mcpjungle/mcpjungle:0.4.6-stdio@sha256:4b647cc6e8134cb95c251d59a352c9a21cca4a7df62f63c7352a37b4b4cc1514
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SERVER_MODE
              value: enterprise
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=production,service.version=0.4.6
            # Idle stateful sessions (e.g. long-lived stdio processes) are reaped.
            - name: SESSION_IDLE_TIMEOUT_SEC
              value: "600"
            # First npx/uvx run downloads packages before the MCP handshake.
            - name: MCP_SERVER_INIT_REQ_TIMEOUT_SEC
              value: "120"
            - name: HOME
              value: /home/mcpjungle
            # OTel process detection needs $USER: uid 1000 has no passwd entry
            # and the binary is built without cgo.
            - name: USER
              value: mcpjungle
            - name: POSTGRES_HOST
              value: mcpjungle-database-cluster-rw
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: mcpjungle
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: mcpjungle-database-user-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcpjungle-database-user-secret
                  key: password
          volumeMounts:
            - name: home
              mountPath: /home/mcpjungle
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: mcpjungle-home
        - name: tmp
          emptyDir: {}
