# Public: only the Streamable HTTP MCP gateway endpoints (global and per tool
# group). Protected by mcpjungle-gateway (nginx checking Bearer token).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcpjungle-external
  namespace: mcpjungle-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`mcp.winetree94.com`) && (Path(`/mcp`) || PathRegexp(`^/v0/groups/[^/]+/mcp$`))
      kind: Rule
      services:
        - name: mcpjungle-gateway
          port: 8080
  tls:
    secretName: letsencrypt-cert
---
# Internal: full Web UI (development mode), admin API, metrics, and SSE
# on mcp.intranet.winetree94.com for LAN/VPN clients.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mcpjungle-internal
  namespace: mcpjungle-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: mcpjungle-service
          port: 8080
  tls:
    secretName: letsencrypt-cert
