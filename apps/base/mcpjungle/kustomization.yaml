apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - mcpjungle.namespace.yaml
  - mcpjungle.database.user.secret.yaml
  - mcpjungle.database.superuser.secret.yaml
  - mcpjungle.gateway.secret.yaml
  - mcpjungle.database.yaml
  - mcpjungle.pvc.yaml
  - mcpjungle.deployment.yaml
  - mcpjungle.gateway.yaml
  - mcpjungle.service.yaml
  - mcpjungle.servicemonitor.yaml
  - mcpjungle.ingress-route.yaml
  - mcpjungle.cilium-network-policy.yaml
configMapGenerator:
  - name: mcpjungle-gateway-config
    namespace: mcpjungle-system
    files:
      - nginx.conf=mcpjungle.gateway.nginx.conf
