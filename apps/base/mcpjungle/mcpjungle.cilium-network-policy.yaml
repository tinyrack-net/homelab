apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-mcpjungle
  namespace: mcpjungle-system
specs:
  # Public internet egress (npm, PyPI, SaaS MCP servers) comes from the
  # isolated-namespaces clusterwide policy.
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: mcpjungle-system
        app: mcpjungle
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring-system
              app.kubernetes.io/name: alloy
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: mcpjungle-system
              cnpg.io/cluster: mcpjungle-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: mcpjungle-system
        cnpg.io/cluster: mcpjungle-database-cluster
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: mcpjungle-system
              app: mcpjungle
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
              - port: "9187"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
              - port: "9187"
                protocol: TCP
      # Barman backups to storage.intranet.winetree94.com via internal Traefik.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-mcpjungle
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: mcpjungle
  annotations:
    networking.tinyrack.net/hosts: mcp.winetree94.com
spec:
  description: Allow the mcp.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: mcpjungle-system
            serviceName: mcpjungle-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-mcpjungle
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: mcpjungle
  annotations:
    networking.tinyrack.net/hosts: mcp.intranet.winetree94.com
spec:
  description: Allow the mcp.intranet.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcpjungle-system
            cnpg.io/cluster: mcpjungle-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: mcpjungle-system
            serviceName: mcpjungle-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
