# Web GUI on the internal Traefik (LAN/VPN only). The GUI calls the RC API on
# the same origin under /api/.
#
# Traefik basicAuth guards the whole host, so the browser asks for the admin
# login once and then sends it on every request, including the GUI's fetches
# to /api/ (rclone checks the same admin entry in its own htpasswd). Bookmark
#   https://rclone.intranet.winetree94.com/login?url=https://rclone.intranet.winetree94.com/api/
# so the GUI learns the RC URL and logs in by itself.
# Login: admin / Bitwarden 344e14cc-213f-410a-9273-b4f700a68590 RCLONE_WEB_ADMIN_PASS.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rclone-ingress-route
  namespace: rclone-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rclone.intranet.winetree94.com`) && PathPrefix(`/api/`)
      kind: Rule
      middlewares:
        - name: rclone-basic-auth
      services:
        - name: rclone
          port: 5572
    - match: Host(`rclone.intranet.winetree94.com`)
      kind: Rule
      middlewares:
        - name: rclone-basic-auth
      services:
        - name: rclone
          port: 5522
  tls:
    secretName: letsencrypt-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rclone-basic-auth
  namespace: rclone-system
spec:
  basicAuth:
    # rclone-secrets key `users`: the admin entry only (mcp stays rclone-internal).
    secret: rclone-secrets
    realm: rclone
