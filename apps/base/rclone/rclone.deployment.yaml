# One rclone process (`rclone gui`) serves the embedded web GUI and the RC API;
# rclone-mcp (Bifrost: rclone) is a sidecar client of the same RC API, so the
# web UI and the agents share remotes, jobs and config.
#
#   :5522        web GUI (static)          -> rclone.intranet.winetree94.com/
#   :5572/api/   RC API, htpasswd auth     -> rclone.intranet.winetree94.com/api/
#                  admin: web GUI login, mcp: rclone-mcp
#   :8000/mcp    rclone-mcp, Bearer token  -> Bifrost only
#
# Toolsets: default + dangerous (purge, config_dump, core_command, ...).
# Secrets: Bitwarden 344e14cc-213f-410a-9273-b4f700a68590
#   (RCLONE_MCP_TOKEN, RCLONE_RC_PASS = mcp login, RCLONE_WEB_ADMIN_PASS = admin login).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rclone
  namespace: rclone-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rclone
  template:
    metadata:
      labels:
        app: rclone
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # A writable copy of rclone.conf, so the GUI and config_* tools can save
        # changes (they last until the pod restarts; the ConfigMap stays the
        # source). Also installs the pinned rclone-mcp npm package.
        - name: init
          image: docker.io/library/node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
          command:
            - sh
            - -c
            - |
              set -e
              cp /config-src/rclone.conf /config/rclone.conf
              mkdir -p /tools/app
              cd /tools/app
              npm install --no-audit --no-fund --omit=dev rclone-mcp@2.0.0
          env:
            - name: HOME
              value: /tmp/home
            - name: npm_config_cache
              value: /tmp/home/.npm
          volumeMounts:
            - name: config-src
              mountPath: /config-src
              readOnly: true
            - name: config
              mountPath: /config
            - name: tools
              mountPath: /tools
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: rclone
          image: docker.io/rclone/rclone:1.75.2@sha256:2687085f718d3c628f7fdfb77c52a1d344332aed543110bb88088f2c70d43eb5
          imagePullPolicy: IfNotPresent
          args:
            - gui
            - --no-open-browser
            - --addr=0.0.0.0:5522
            - --api-addr=0.0.0.0:5572
            - --rc-baseurl=/api
            - --rc-htpasswd=/secrets/htpasswd
            - --config=/config/rclone.conf
            - --cache-dir=/tmp/rclone-cache
          ports:
            - name: gui
              containerPort: 5522
              protocol: TCP
            - name: api
              containerPort: 5572
              protocol: TCP
          # RCLONE_CONFIG_<REMOTE>_* are read from the env.
          env:
            - name: HOME
              value: /tmp/home
          envFrom:
            - secretRef:
                name: rclone-secrets
          volumeMounts:
            - name: config
              mountPath: /config
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /secrets
              readOnly: true
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: gui
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: rclone-mcp
          image: docker.io/library/node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /tools/app/node_modules/rclone-mcp/dist/index.js
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
          env:
            - name: HOME
              value: /tmp/home
            - name: RCLONE_URL
              value: http://127.0.0.1:5572/api
            - name: RCLONE_USER
              value: mcp
            - name: RCLONE_PASS
              valueFrom:
                secretKeyRef:
                  name: rclone-secrets
                  key: RCLONE_RC_PASS
            - name: RCLONE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rclone-secrets
                  key: RCLONE_MCP_TOKEN
            - name: RCLONE_TOOLSETS
              value: default,dangerous
          volumeMounts:
            - name: tools
              mountPath: /tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # rclone-mcp has no health endpoint (only /mcp).
          startupProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: mcp
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-src
          configMap:
            name: rclone-config
        - name: config
          emptyDir: {}
        - name: tools
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: secrets
          secret:
            secretName: rclone-secrets
            items:
              - key: htpasswd
                path: htpasswd
            defaultMode: 0440
