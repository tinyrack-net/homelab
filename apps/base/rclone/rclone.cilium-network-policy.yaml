apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-rclone
  namespace: rclone-system
spec:
  # Only Bifrost talks to rclone-mcp. Hetzner and AWS S3 and the npm registry
  # are public and covered by the isolated-namespaces policy.
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: rclone-system
      app: rclone
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # homelab_garage goes through internal Traefik (Garage S3).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
