apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-rclone
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: rclone
  annotations:
    networking.tinyrack.net/hosts: storage.intranet.winetree94.com
spec:
  description: Allow rclone (homelab_garage remote) to reach Garage S3
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rclone-system
            app: rclone
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
