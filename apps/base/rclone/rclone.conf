# rclone remotes. Keys come from the RCLONE_CONFIG_<REMOTE>_* env vars of
# rclone-secrets (env_auth = true), the same way the local secrets.zsh does.
[homelab_garage]
type = s3
provider = Other
env_auth = true
region = home
endpoint = https://storage.intranet.winetree94.com
acl = private
bucket_acl = private

[hetzner_fsn]
type = s3
provider = Other
env_auth = true
region = fsn1
endpoint = https://fsn1.your-objectstorage.com
acl = private
bucket_acl = private

[hetzner_hel]
type = s3
provider = Other
env_auth = true
region = hel1
endpoint = https://hel1.your-objectstorage.com
acl = private
bucket_acl = private

[vivident_intranet_s3]
type = s3
provider = Other
env_auth = true
region = ap-northeast-2
endpoint = https://s3.ap-northeast-2.amazonaws.com
acl = private
bucket_acl = private
