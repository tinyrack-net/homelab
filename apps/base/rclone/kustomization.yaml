apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rclone.namespace.yaml
  - rclone.secret.yaml
  - rclone.deployment.yaml
  - rclone.service.yaml
  - rclone.cilium-network-policy.yaml
  - rclone.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: rclone-config
    namespace: rclone-system
    files:
      - rclone.conf=rclone.conf
