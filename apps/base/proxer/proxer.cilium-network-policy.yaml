apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-proxer
  namespace: proxer-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: proxer-system
        app: proxer
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toCIDR:
          - 10.132.244.0/22
