apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: personal-data-database-backup-store
  namespace: personal-data-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/personal-data/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
# Roles:
# - personal:  owner of the personal database. Mathesar connects as this role
#              (configured in the Mathesar web UI, not in a manifest).
# - mcp_agent: login role for postgres-mcp. It is a member of personal and its
#              session role defaults to personal, so objects an agent creates
#              are owned by personal and stay editable in Mathesar. Revoke MCP
#              access by disabling this role alone.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: personal-data-database-cluster
  namespace: personal-data-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:7de76b3e35aa846a86715a4135f62b2371b8bcf9545c2c33e589b1201e489668
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: personal-data-database-backup-store
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  managed:
    roles:
      - name: mcp_agent
        ensure: present
        login: true
        inherit: true
        inRoles:
          - personal
        passwordSecret:
          name: personal-data-database-mcp-secret
        comment: postgres-mcp agent access (session role defaults to personal)
  bootstrap:
    initdb:
      database: personal
      owner: personal
      secret:
        name: personal-data-database-owner-secret
      # The managed role above adopts mcp_agent and sets its login and
      # password; the per-role setting below is not expressible there.
      postInitApplicationSQL:
        - CREATE ROLE mcp_agent NOLOGIN
        - GRANT personal TO mcp_agent
        - ALTER ROLE mcp_agent SET role = 'personal'
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: personal-database
  namespace: personal-data-system
spec:
  name: personal
  owner: personal
  databaseReclaimPolicy: retain
  cluster:
    name: personal-data-database-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: personal-data-backup
  namespace: personal-data-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: personal-data-database-cluster
