apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - email-mcp.namespace.yaml
  - email-mcp.secret.yaml
  - email-mcp.pvc.yaml
  - email-mcp.deployment.yaml
  - email-mcp.service.yaml
  - email-mcp.cilium-network-policy.yaml
configMapGenerator:
  - name: email-mcp-config
    namespace: email-mcp-system
    files:
      - config.toml=email-mcp.config.toml
