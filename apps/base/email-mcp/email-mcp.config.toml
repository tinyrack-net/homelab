# Converted from ~/.config/himalaya/config.toml (see plans/bifrost-email-rclone-mcp.md).
# Account names match the himalaya account names. Passwords resolve from the
# MAIL_*_PASSWORD env vars of email-mcp-secrets (Bitwarden item ids are the
# ones referenced by the himalaya password commands).

[settings]
rate_limit = 10
read_only = false

# File a copy of every sent message in the IMAP \Sent folder. Stalwart does
# not file submissions itself; email-mcp skips Gmail accounts on its own
# because Gmail already files them (verified: no duplicate).
[settings.send]
save_to_sent = true

[settings.verification]
enabled = false

[settings.attachments]
auto_download = false

[settings.watcher]
enabled = false

[settings.hooks]
on_new_email = "none"

