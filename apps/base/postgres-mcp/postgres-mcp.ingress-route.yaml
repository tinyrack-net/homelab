# Internal only (LAN and VPN via *.intranet.winetree94.com); no Cloudflare route.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: postgres-mcp
  namespace: postgres-mcp-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`postgres-mcp.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: postgres-mcp
          port: 8080
  tls:
    secretName: letsencrypt-cert
