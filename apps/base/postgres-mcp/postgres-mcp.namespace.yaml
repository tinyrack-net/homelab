# Shared Postgres MCP server (pgEdge Postgres MCP Server), internal only.
#
# Adding a database:
#   1. Create a dedicated login role in the target database.
#   2. Allow postgres-mcp-system in the target database's own network policy,
#      and add the target to the egress list in postgres-mcp.cilium-network-policy.yaml.
#   3. Add the database to postgres-mcp.yaml in postgres-mcp.config.secret.yaml.
#   4. Issue a token bound to it (pgedge-postgres-mcp -add-token -token-database <name>),
#      store the token in Bitwarden and add the hash to postgres-mcp.tokens.secret.yaml.
# API tokens are bound to one database, so clients register one MCP entry per database.
apiVersion: v1
kind: Namespace
metadata:
  name: postgres-mcp-system
  labels:
    networking.tinyrack.net/isolation: enabled
