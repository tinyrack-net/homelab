apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp
  namespace: postgres-mcp-system
  labels:
    app.kubernetes.io/name: postgres-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-mcp
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-mcp
          image: ghcr.io/pgedge/postgres-mcp:1.1.0@sha256:38c1c7b7c1ec5b1b64a1da4a2f24be3efef2ac235503bd2e6ff129954e471efd
          imagePullPolicy: IfNotPresent
          # Skip the image's init script (it generates config from env vars and
          # switches users); run the server directly with the mounted config.
          command:
            - /app/pgedge-postgres-mcp
            - -config
            - /etc/postgres-mcp/config/postgres-mcp.yaml
            - -http
          env:
            - name: PGEDGE_DATA_DIR
              value: /app/data
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/postgres-mcp/config
              readOnly: true
            # Token changes are picked up without a restart (fsnotify).
            - name: tokens
              mountPath: /etc/postgres-mcp/tokens
              readOnly: true
            # Conversation store, user store and the generated secret file.
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: postgres-mcp-config
        - name: tokens
          secret:
            secretName: postgres-mcp-tokens
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
