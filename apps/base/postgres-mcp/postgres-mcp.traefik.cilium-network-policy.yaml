apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-postgres-mcp
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: postgres-mcp
  annotations:
    networking.tinyrack.net/hosts: postgres-mcp.intranet.winetree94.com
spec:
  description: Allow the postgres-mcp.intranet.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: postgres-mcp-system
            serviceName: postgres-mcp
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
