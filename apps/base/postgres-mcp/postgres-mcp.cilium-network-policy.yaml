apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-postgres-mcp
  namespace: postgres-mcp-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: postgres-mcp-system
        app.kubernetes.io/name: postgres-mcp
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      # Registered databases only.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: personal-data-system
              cnpg.io/cluster: personal-data-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
