apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: searxng-ingress-route
  namespace: searxng-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`search.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: searxng-service
          port: 80
  tls:
    secretName: letsencrypt-cert
