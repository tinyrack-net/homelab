# Internal only: *.intranet.winetree94.com resolves to internal Traefik on
# the LAN and over VPN; there is no Cloudflare route for this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mathesar
  namespace: mathesar-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tables.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: mathesar
          port: 8000
  tls:
    secretName: letsencrypt-cert
