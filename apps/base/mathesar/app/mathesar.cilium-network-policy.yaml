apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-mathesar
  namespace: mathesar-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: mathesar-system
        app.kubernetes.io/name: mathesar
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
    egress:
      # Internal (Django) database.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: mathesar-system
              cnpg.io/cluster: mathesar-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      # User databases connected from the web UI. Each database namespace must
      # also allow mathesar in its own policy.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: personal-data-system
              cnpg.io/cluster: personal-data-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      # OIDC token and userinfo calls to Issuary through the public hostname,
      # which resolves to the internal traefik-external LB.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
