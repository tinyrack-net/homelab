# Mathesar's internal (Django) database only. User data lives in standalone
# databases such as personal-data, which are connected from the Mathesar web
# UI; their role passwords are stored here, encrypted with SECRET_KEY.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mathesar-database-backup-store
  namespace: mathesar-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/mathesar/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mathesar-database-cluster
  namespace: mathesar-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mathesar-database-backup-store
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  externalClusters:
    - name: mathesar-database-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: mathesar-database-backup-store
          serverName: mathesar-database-cluster
  # Initialised with initdb on 2026-10-28; a recreated cluster restores from
  # the Barman backups instead of starting empty.
  bootstrap:
    recovery:
      source: mathesar-database-recovery-source
      database: mathesar_django
      owner: mathesar
      secret:
        name: mathesar-database-user-secret
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mathesar-django-database
  namespace: mathesar-system
spec:
  name: mathesar_django
  owner: mathesar
  databaseReclaimPolicy: retain
  cluster:
    name: mathesar-database-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mathesar-backup
  namespace: mathesar-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: mathesar-database-cluster
