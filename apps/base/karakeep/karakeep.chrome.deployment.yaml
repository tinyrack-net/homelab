apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-chrome
  namespace: karakeep-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
        - args:
            - --disable-gpu
            - --disable-dev-shm-usage
            - --hide-scrollbars
            - --disable-blink-features=AutomationControlled
            - --window-size=1440,900
          image: ghcr.io/karakeep-app/karakeep-chrome:154.0.8037.57-r1@sha256:ee540547a695708e35e20da8e5032e2f9760499e2f91283b265f6f132f81d503
          name: chrome
