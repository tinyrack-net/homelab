apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-web
  namespace: karakeep-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-web
  template:
    metadata:
      annotations:
        karakeep.winetree94.com/auth-migration: issuary-auth-domain-20260825
      labels:
        app: karakeep-web
        observability.tinyrack.net/otlp-client: "true"
    spec:
      containers:
        - env:
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch-service:7700
            - name: BROWSER_WEB_URL
              value: http://karakeep-chrome-service:9222
            - name: DATA_DIR
              value: /data
          envFrom:
            - secretRef:
                name: karakeep-secrets
            - configMapRef:
                name: karakeep-config-map
          image: ghcr.io/karakeep-app/karakeep:0.35.0@sha256:6f7d32ef296ddf1fc7c67ff56b8a201b7006a6a47b92b202afee1338841b353d
          imagePullPolicy: Always
          name: web
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data-storage
