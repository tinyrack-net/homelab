apiVersion: apps/v1
kind: Deployment
metadata:
  name: karakeep-web
  namespace: karakeep-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karakeep-web
  template:
    metadata:
      annotations:
        karakeep.winetree94.com/auth-migration: issuary-auth-domain-20260825
      labels:
        app: karakeep-web
        observability.tinyrack.net/otlp-client: "true"
    spec:
      containers:
        - env:
            - name: MEILI_ADDR
              value: http://karakeep-meilisearch-service:7700
            - name: BROWSER_WEB_URL
              value: http://karakeep-chrome-service:9222
            - name: DATA_DIR
              value: /data
          envFrom:
            - secretRef:
                name: karakeep-secrets
            - configMapRef:
                name: karakeep-config-map
          image: ghcr.io/karakeep-app/karakeep:0.34.1@sha256:69ae5315c618b7c14c1af3e34c6e211acdb231793af424ecd1cab0b70691d987
          imagePullPolicy: Always
          name: web
          ports:
            - containerPort: 3000
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: karakeep-data-storage
