apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-nextcloud
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: nextcloud
  annotations:
    networking.tinyrack.net/hosts: cloud.winetree94.com
spec:
  description: Allow the cloud.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nextcloud-system
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/component: app
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: nextcloud-system
            serviceName: nextcloud
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-nextcloud
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: nextcloud
  annotations:
    networking.tinyrack.net/hosts: cloud.winetree94.com
spec:
  description: Allow Nextcloud pods to reach Garage S3 through internal Traefik
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nextcloud-system
            app.kubernetes.io/name: nextcloud
        # Barman WAL/backup archiving from the CloudNativePG instance.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nextcloud-system
            cnpg.io/cluster: nextcloud-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
