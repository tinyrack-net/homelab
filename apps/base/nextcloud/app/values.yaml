# Nextcloud 9.4.0 (appVersion 35.0.1) - Apache flavor
# Files live in Garage S3 (primary object storage); the PVC keeps app code,
# config.php, instanceid, apps and themes only.

replicaCount: 1

nextcloud:
  host: cloud.winetree94.com
  datadir: /var/www/html/data
  # Keep the internal service DNS name trusted so the metrics exporter and
  # in-cluster occ-style calls are accepted.
  trustedDomains:
    - cloud.winetree94.com
    - nextcloud.nextcloud-system.svc
    - nextcloud.nextcloud-system.svc.cluster.local
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-secret
    usernameKey: username
    passwordKey: password
    tokenKey: nextcloud-token

  # PHP config file mounted into /var/www/html/config/. Traefik terminates TLS
  # and speaks plain HTTP to the pod, so the proxy ranges must be trusted and
  # the public URL pinned.
  configs:
    # auth.winetree94.com (Issuary) resolves to the internal Traefik LB from
    # inside the cluster, so the OIDC discovery and token calls target a private
    # address. Nextcloud's HTTP client refuses private targets unless this is
    # enabled, which made every user_oidc login fail with
    # "Could not reach the provider at URL .../.well-known/openid-configuration".
    local-server.config.php: |-
      <?php
      $CONFIG = array (
        'allow_local_remote_servers' => true,
      );

    proxy.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_proxies' => ['10.61.0.0/16', '10.62.0.0/16'],
        'overwritehost' => 'cloud.winetree94.com',
        'overwriteprotocol' => 'https',
        'overwrite.cli.url' => 'https://cloud.winetree94.com',
        'forwarded_for_headers' => ['HTTP_CF_CONNECTING_IP', 'HTTP_X_FORWARDED_FOR'],
        // The image only pushes NEXTCLOUD_TRUSTED_DOMAINS into config.php while
        // it runs its first-boot install; that step was interrupted by the old
        // liveness probe, leaving trusted_domains as ['localhost']. Declare the
        // domains here so they are always rendered into config.php.
        'trusted_domains' => [
          'cloud.winetree94.com',
          'nextcloud.nextcloud-system.svc',
          'nextcloud.nextcloud-system.svc.cluster.local',
          'localhost',
        ],
      );

    # SSO-only policy. user_oidc already redirects /login to Issuary
    # (allow_multiple_user_backends=0), so this only removes the last ways the
    # web UI could still show a password form: the form itself and the
    # "forgot password" link. `?direct=1` still renders the classic form, which
    # is the documented break-glass path once `occ user:enable nextcloud` has
    # restored the local account.
    sso-only.config.php: |-
      <?php
      $CONFIG = array (
        'hide_login_form' => true,
        'lost_password_link' => 'disabled',
      );

  # Nextcloud defaults its temp directory to /tmp on the container root
  # filesystem. Pin it to a bounded emptyDir so archive/upload staging cannot
  # fill the node disk.
  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 20Gi
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp

  # /metrics endpoint access list (pod + service CIDRs).
  openmetrics:
    allowedClients:
      - "10.61.0.0/16"
      - "10.62.0.0/16"

  strategy:
    type: Recreate

  # Primary object storage: Garage S3.
  objectStore:
    s3:
      enabled: true
      host: storage.intranet.winetree94.com
      port: "443"
      ssl: true
      region: home
      bucket: tinyrack-homelab-nextcloud-storage
      usePathStyle: true
      autoCreate: false
      existingSecret: tinyrack-homelab-s3-secret
      secretKeys:
        accessKey: AWS_ACCESS_KEY_ID
        secretKey: AWS_SECRET_ACCESS_KEY

# Application PVC: config.php, instanceid, apps, themes, log. Files are in S3.
persistence:
  enabled: true
  storageClass: longhorn-rwx
  accessMode: ReadWriteMany
  size: 16Gi
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/longhorn-backup: enabled
  nextcloudData:
    enabled: false

# Database: CloudNativePG (see ../database).
internalDatabase:
  enabled: false
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-database-cluster-rw.nextcloud-system.svc
  database: nextcloud
  user: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-database-user-secret
    usernameKey: username
    passwordKey: password
mariadb:
  enabled: false
postgresql:
  enabled: false

# Cache + file locking: opstree Redis operator (see ../redis).
redis:
  enabled: false
externalRedis:
  enabled: true
  host: nextcloud-redis.nextcloud-system.svc
  port: "6379"
  existingSecret:
    enabled: true
    secretName: nextcloud-redis-secret
    passwordKey: password

# Background jobs as a dedicated CronJob rather than an in-pod crond sidecar.
cronjob:
  enabled: true
  type: cronjob
  cronjob:
    # The CronJob shares the app PVC, but the chart leaves the pod running as
    # root, and cron.php refuses to start when config/config.php is owned by
    # uid 33. Run the job as the same user as the web container.
    securityContext:
      runAsUser: 33
      runAsGroup: 33
      runAsNonRoot: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi

# The first boot copies the Nextcloud code from the image into the RWX
# Longhorn volume (~500MB of small files over NFS), which takes minutes. The
# chart's default liveness probe (10s delay, 3 failures) killed the container
# mid-copy, so the pod never became ready, the Deployment hit
# ProgressDeadlineExceeded and the Helm install was marked failed. Gate the
# liveness/readiness probes behind a startup probe that allows a slow first
# initialization; it only runs until the first successful /status.php.
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  # The first boot copies the code (~7 min over RWX NFS) and installs the
  # database schema, so allow a generous window before liveness kicks in.
  failureThreshold: 120
  successThreshold: 1
livenessProbe:
  initialDelaySeconds: 30
  failureThreshold: 6
readinessProbe:
  initialDelaySeconds: 10

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Metrics: /metrics openmetrics on the app service + nextcloud-exporter.
metrics:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus:
  serviceMonitor:
    enabled: true

# Public entry point is a Traefik IngressRoute (cloud.winetree94.com).
ingress:
  enabled: false
