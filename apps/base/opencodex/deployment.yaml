apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencodex
  namespace: opencodex-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opencodex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencodex
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-state
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command: ["/bin/sh", "-c"]
          args:
            - >-
              mkdir -p /state/opencodex /state/codex;
              chown -R 1000:1000 /state;
              chmod 700 /state/opencodex /state/codex;
              if [ ! -s /state/opencodex/config.json ]; then
                cp /config/config.json /state/opencodex/config.json;
                chmod 600 /state/opencodex/config.json;
              fi;
              if [ ! -s /state/opencodex/service-api-token ]; then
                cp /bootstrap/OPENCODEX_API_AUTH_TOKEN /state/opencodex/service-api-token;
                chmod 600 /state/opencodex/service-api-token;
              fi;
              chown -R 1000:1000 /state
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE]
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
      containers:
        - name: opencodex
          image: ghcr.io/tinyrack-net/opencodex:3.0.0@sha256:b8f837f30598b67013f92e1e9d03749b9cc201092d203860b854b2d42d73d5eb # {"$imagepolicy": "flux-system:opencodex"}
          imagePullPolicy: Always
          env:
            - {name: OPENCODEX_HOME, value: /state/opencodex}
            - {name: CODEX_HOME, value: /state/codex}
            - {name: OCX_API_TOKEN_FILE, value: /state/opencodex/service-api-token}
          ports:
            - {name: data, containerPort: 10100, protocol: TCP}
            - {name: management, containerPort: 10101, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          readinessProbe:
            httpGet: {path: /readyz, port: data}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /healthz, port: data}
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: tmp, mountPath: /tmp}
        - name: management-proxy
          image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
          args: ["TCP-LISTEN:10102,fork,reuseaddr,bind=0.0.0.0", "TCP:127.0.0.1:10101"]
          ports:
            - {name: mgmtproxy, containerPort: 10102, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
      volumes:
        - {name: state, persistentVolumeClaim: {claimName: opencodex-state}}
        - {name: bootstrap, secret: {secretName: opencodex-bootstrap}}
        - {name: config, configMap: {name: opencodex-config}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
