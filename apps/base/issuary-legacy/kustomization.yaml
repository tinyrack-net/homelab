apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Keep legacy tinyauth Kubernetes and database names to preserve persistent data
# and the namespace/name binding of the existing SealedSecrets.
resources:
  - issuary.namespace.yaml
  - issuary.database.superuser.secret.yaml
  - issuary.database.user.secret.yaml
  - issuary.database.yaml
  - issuary.config-map.yaml
  - issuary.secrets.yaml
  - issuary.deployment.yaml
  - issuary.service.yaml
