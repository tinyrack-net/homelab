apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-home-assistant
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: home-assistant
  annotations:
    networking.tinyrack.net/hosts: home-assistant.winetree94.com
spec:
  description: Allow the home-assistant.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: home-assistant-system
            serviceName: home-assistant
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
