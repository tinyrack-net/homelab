apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: home-assistant-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mosquitto
          image: docker.io/library/eclipse-mosquitto:2.1.2-alpine@sha256:12436df85d6b2b91e63c71184da35ec89400a98abdc688a78b1403a11ecf44b4
          imagePullPolicy: IfNotPresent
          env:
            # mosquitto 2.1 refuses to load sensitive files (password_file, acl_file)
            # through symbolic links. Kubernetes ConfigMap/Secret volumes are symlink
            # trees, so opt back in with the escape hatch mosquitto provides for
            # container environments. Without it the broker fails to start and exits.
            - name: MOSQUITTO_UNSAFE_ALLOW_SYMLINKS
              value: "true"
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
            - name: data
              mountPath: /mosquitto/data
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
            items:
              - key: mosquitto.conf
                path: mosquitto.conf
              - key: mosquitto.acl
                path: acl
        - name: auth
          secret:
            secretName: mosquitto-auth
            defaultMode: 0440
            items:
              - key: passwd
                path: passwd
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
