apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-hermes
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: hermes
  annotations:
    networking.tinyrack.net/hosts: hermes.intranet.winetree94.com
spec:
  description: Allow the hermes.intranet.winetree94.com route and Hermes' access to the intranet applications
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  # Hermes reaches Bifrost and the other intranet applications through this
  # Traefik instead of talking to their pods directly.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-system
            app: hermes
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: hermes-system
            serviceName: hermes
      toPorts:
        - ports:
            - port: "9120"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-hermes
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: hermes
spec:
  description: Allow Hermes to reach the public homelab routes, including Issuary OIDC
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: hermes-system
            app: hermes
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
