apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-hermes
  namespace: hermes-system
specs:
  # The agent only accepts traffic from the internal Traefik, which serves the
  # Webapp and the remote-gateway endpoint for Hermes Desktop. DNS and public
  # internet come from the isolated-namespaces clusterwide policy.
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: hermes-system
        app: hermes
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "9120"
                protocol: TCP
    egress:
      # Internal Traefik: Bifrost (llm.intranet.winetree94.com) and the other
      # intranet applications, reached the same way LAN clients reach them.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # External Traefik: Issuary (auth.winetree94.com) for OIDC discovery,
      # token and JWKS calls, and the other public homelab hostnames that
      # resolve to its LoadBalancer IP inside the LAN.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # The internal networks: the LAN behind OPNsense (hosts, VMs and the
      # Traefik LoadBalancer IPs), the WireGuard VPN ranges and Tailscale.
      # No port restriction: a general-purpose agent reaches arbitrary hosts
      # and ports there. In-cluster pod and service ranges stay blocked and
      # must be allowed per endpoint or service when a task needs them.
      - toCIDRSet:
          - cidrGroupRef: lan
          - cidrGroupRef: vpn-server
          - cidrGroupRef: vpn-control
          - cidrGroupRef: tailscale
