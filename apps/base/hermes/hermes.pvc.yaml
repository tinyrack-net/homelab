# HERMES_HOME (/opt/data): config, .env, sessions (SQLite WAL), memories,
# skills and the bot desktop's browser profile. SQLite WAL needs a local block
# filesystem, so this stays on Longhorn instead of NFS/JuiceFS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: hermes-agent
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/longhorn-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn-strict-local
  volumeMode: Filesystem
