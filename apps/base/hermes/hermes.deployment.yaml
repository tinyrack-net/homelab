apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes-system
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  # Two gateways must never share one HERMES_HOME, and the RWO volume attaches
  # to a single pod anyway.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
        app.kubernetes.io/name: hermes-agent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # s6-overlay's /init must be PID 1 (no shareProcessNamespace) so the
      # gateway is supervised and orphaned browser/MCP processes are reaped.
      terminationGracePeriodSeconds: 60
      containers:
        - name: hermes
          # The -desktop variant bakes in TigerVNC + Xfce + Chromium for the
          # Bot Screen (the agent's own desktop, viewed from the Webapp).
          image: docker.io/nousresearch/hermes-agent:v0.23.0-desktop@sha256:399ec6c0052a945b06b38de9d44d26b636237a60e97422d2d81f1c38b8d7c9fd
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - run
          # The image starts as root to fix volume ownership, then s6 drops
          # every service to the hermes user (uid 10000), so runAsNonRoot is
          # not set here.
          env:
            - name: TZ
              value: Asia/Seoul
          envFrom:
            - secretRef:
                name: hermes-secrets
          ports:
            - name: http
              containerPort: 9120
              protocol: TCP
          resources:
            # Gateway ~300Mi idle; the bot screen adds ~220Mi and a headed
            # Chromium 0.5-1Gi. The limit includes the /dev/shm tmpfs.
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          # TCP probes: the listener's Host-header guard only accepts the
          # public hostname, so an HTTP probe against the pod IP is rejected.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /opt/data
            # Single file so the image's other /etc/hermes contents stay.
            - name: managed-config
              mountPath: /etc/hermes/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: managed-config
          configMap:
            name: hermes-managed-config
            defaultMode: 0444
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
