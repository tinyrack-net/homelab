# Internal only: *.intranet.winetree94.com resolves to internal Traefik on
# the LAN and over VPN; there is no Cloudflare route for this host.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes
  namespace: hermes-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hermes.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: hermes
          port: 9120
          scheme: http
  tls:
    secretName: letsencrypt-cert
