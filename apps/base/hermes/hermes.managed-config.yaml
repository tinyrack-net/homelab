# Hermes managed scope (/etc/hermes/config.yaml). Keys set here win over the
# user config in /opt/data/config.yaml and cannot be changed from the UI; every
# other key (model choice, toolsets, skills, ...) stays user-controlled.
# https://hermes-agent.nousresearch.com/docs/user-guide/managed-scope

# Desktop workspace in the browser, also the endpoint Hermes Desktop connects
# to as a remote gateway. Internal Traefik terminates TLS and forwards here.
webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.intranet.winetree94.com

dashboard:
  # Only internal Traefik can reach the pod (CiliumNetworkPolicy), so trusting
  # X-Forwarded-* from the pod range only admits Traefik in practice.
  trusted_proxies:
    - 10.61.0.0/16
  # Sign-in through Issuary (public PKCE client "hermes").
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.winetree94.com
      client_id: hermes
      scopes: openid profile email offline_access

# LLM access goes through Bifrost with the "hermes" virtual key.
providers:
  bifrost:
    name: Bifrost
    api: https://llm.intranet.winetree94.com/v1
    key_env: BIFROST_API_KEY
    transport: chat_completions
