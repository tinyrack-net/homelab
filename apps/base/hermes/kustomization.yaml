apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - hermes.namespace.yaml
  - hermes.secrets.yaml
  - hermes.pvc.yaml
  - hermes.deployment.yaml
  - hermes.service.yaml
  - hermes.ingress-route.yaml
  - hermes.cilium-network-policy.yaml
  - hermes.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: hermes-managed-config
    namespace: hermes-system
    files:
      - config.yaml=hermes.managed-config.yaml
