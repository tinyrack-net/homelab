apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: browseros-neo
  namespace: browseros-vivident-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vivident.browseros.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: browseros-neo-gui
          port: 5800
  tls:
    secretName: letsencrypt-cert
