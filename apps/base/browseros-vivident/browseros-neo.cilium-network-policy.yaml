apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-browseros-neo
  namespace: browseros-vivident-system
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: browseros-vivident-system
      app.kubernetes.io/name: browseros-neo
  ingress:
    # Web GUI through internal Traefik.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "5800"
              protocol: TCP
    # MCP through the dedicated L2 LoadBalancer IP, internal networks only.
    - fromCIDRSet:
        - cidrGroupRef: lan
        - cidrGroupRef: vpn-server
        - cidrGroupRef: vpn-control
        - cidrGroupRef: tailscale
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
