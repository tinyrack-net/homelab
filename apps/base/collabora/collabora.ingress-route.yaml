apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: collabora
  namespace: collabora-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`office.winetree94.com`)
      kind: Rule
      services:
        - name: collabora
          port: 9980
  tls:
    secretName: letsencrypt-cert
