apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
  namespace: collabora-system
spec:
  interval: 5m
  timeout: 15m
  releaseName: collabora
  targetNamespace: collabora-system
  storageNamespace: collabora-system
  chart:
    spec:
      chart: collabora-online
      version: "1.3.6"
      sourceRef:
        kind: HelmRepository
        name: collabora-repository
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: collabora-values
      valuesKey: values.yaml
