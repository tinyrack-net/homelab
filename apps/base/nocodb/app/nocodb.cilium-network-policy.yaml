apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-nocodb
  namespace: nocodb-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: nocodb-system
        app.kubernetes.io/name: nocodb
    ingress:
      # Public route through traefik-external.
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      # PostgreSQL (CloudNativePG).
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: nocodb-system
              cnpg.io/cluster: nocodb-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      # Notification mail through the public SMTP submission endpoint.
      # CiliumCIDRGroup cannot be referenced from `except`, so these stay literal.
      - toCIDRSet:
          - cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # RFC1918 private
              - 100.64.0.0/10 # RFC6598 CGNAT (Tailscale)
              - 169.254.0.0/16 # Link-local
              - 172.16.0.0/12 # RFC1918 private
              - 192.168.0.0/16 # RFC1918 private
        toPorts:
          - ports:
              - port: "587"
                protocol: TCP # SMTP submission
