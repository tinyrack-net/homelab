apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-nocodb
  namespace: nocodb-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: nocodb-system
        app.kubernetes.io/name: nocodb
    ingress:
      # Public route through traefik-external.
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      # PostgreSQL (CloudNativePG).
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: nocodb-system
              cnpg.io/cluster: nocodb-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
