apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nocodb.secrets.yaml
  - nocodb.deployment.yaml
  - nocodb.service.yaml
  - nocodb.ingress-route.yaml
  - nocodb.cilium-network-policy.yaml
  - nocodb.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: nocodb-config
    namespace: nocodb-system
    envs:
      - nocodb.env
