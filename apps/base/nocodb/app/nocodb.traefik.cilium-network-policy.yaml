apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-nocodb
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: nocodb
  annotations:
    networking.tinyrack.net/hosts: tables.winetree94.com
spec:
  description: Allow the tables.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: nocodb-system
            serviceName: nocodb
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-nocodb
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: nocodb
  annotations:
    networking.tinyrack.net/hosts: storage.intranet.winetree94.com
spec:
  description: Allow NocoDB's JuiceFS mounts and database backups to reach Garage S3
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app: juicefs-csi-node
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: juicefs-mount
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nocodb-system
            cnpg.io/cluster: nocodb-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
