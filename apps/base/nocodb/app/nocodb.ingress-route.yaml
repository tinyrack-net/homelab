apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nocodb-http
  namespace: nocodb-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`tables.winetree94.com`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
      services:
        - name: nocodb
          port: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nocodb
  namespace: nocodb-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`tables.winetree94.com`)
      kind: Rule
      services:
        - name: nocodb
          port: 8080
  tls:
    secretName: letsencrypt-cert
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: nocodb-system
spec:
  redirectScheme:
    scheme: https
    permanent: true
