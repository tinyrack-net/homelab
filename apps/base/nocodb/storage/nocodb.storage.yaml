# NocoDB keeps attachments in its local data directory (/usr/app/data). That
# directory is a JuiceFS volume whose data chunks live in the Garage bucket
# tinyrack-homelab-nocodb-storage (reached only through the internal
# storage.intranet endpoint) and whose metadata lives in the juicefs schema of
# the NocoDB database. Browsers never talk to Garage directly.
#
# Do not enable the NocoDB S3 storage plugin (NC_S3_*): it would split
# attachments between local paths and S3 URLs. Grow this PVC instead.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nocodb-juicefs
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: nocodb-juicefs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: nocodb-system
  csi.storage.k8s.io/node-publish-secret-name: nocodb-juicefs-secret
  csi.storage.k8s.io/node-publish-secret-namespace: nocodb-system
mountOptions:
  - cache-dir=/var/lib/jfs-cache
  - cache-size=10240
  - free-space-ratio=0.2
  - buffer-size=100
  - put-timeout=3600
  - max-uploads=2
  - upload-delay=10s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nocodb-data
  namespace: nocodb-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    storage.tinyrack.net/profile: nocodb
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: nocodb-juicefs
  volumeMode: Filesystem
