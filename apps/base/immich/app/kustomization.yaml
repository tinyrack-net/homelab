apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - immich.juicefs.secret.yaml
  - immich.storage.yaml
  - immich.helm-release.yaml
  - immich.ingress-route.yaml
  - immich.cilium-network-policy.yaml
  - immich.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: immich-values
    namespace: immich-system
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
