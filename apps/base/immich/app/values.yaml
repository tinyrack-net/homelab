controllers:
  main:
    containers:
      main:
        image:
          tag: v3.2.2
        env:
          DB_HOSTNAME: immich-database-cluster-rw.immich-system.svc.cluster.local
          DB_DATABASE_NAME: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: password
          TZ: Asia/Seoul

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      pod:
        labels:
          observability.tinyrack.net/otlp-client: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.2.2@sha256:6b0eaf8cfea6d4d6f86a45dfd0c9e3b068ed4493d8b7fa1efeca4cc87792fbe8
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 4Gi
          env:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring-trace-sampler.monitoring-system.svc.cluster.local:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_SERVICE_NAME: immich
            OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=3.2.2
            OTEL_TRACES_SAMPLER: parentbased_always_on
            OTEL_SDK_DISABLED: "false"
          probes:
            liveness:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 18

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.2.2@sha256:390453a571ca73b563cc3d9a12a37a4d71217b12608de72f26884f5e2ebc4896
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local
