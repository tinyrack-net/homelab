controllers:
  main:
    containers:
      main:
        image:
          tag: v3.3.0
        env:
          DB_HOSTNAME: immich-database-cluster-rw.immich-system.svc.cluster.local
          DB_DATABASE_NAME: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: password
          TZ: Asia/Seoul

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      pod:
        labels:
          observability.tinyrack.net/otlp-client: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.3.0@sha256:fecc1545758435d16677bc925036e79a1a8c28e069496300c9ffae3b5230db19
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 4Gi
          env:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring-trace-sampler.monitoring-system.svc.cluster.local:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_SERVICE_NAME: immich
            OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=3.3.0
            OTEL_TRACES_SAMPLER: parentbased_always_on
            OTEL_SDK_DISABLED: "false"
          probes:
            liveness:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 18

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.3.0@sha256:7ee42146a771fa8ca335f6b7604603e488a95730fdcfb2da71b40428fcefb7f2
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local
