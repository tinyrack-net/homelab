controllers:
  main:
    containers:
      main:
        image:
          tag: v3.1.0
        env:
          DB_HOSTNAME: immich-database-cluster-rw.immich-system.svc.cluster.local
          DB_DATABASE_NAME: immich
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: username
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-user-secret
                key: password
          TZ: Asia/Seoul

immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

server:
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      pod:
        labels:
          observability.tinyrack.net/otlp-client: "true"
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1500m
              memory: 4Gi
          env:
            OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring-trace-sampler.monitoring-system.svc.cluster.local:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            OTEL_SERVICE_NAME: immich
            OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=production,service.version=3.1.0
            OTEL_TRACES_SAMPLER: parentbased_always_on
            OTEL_SDK_DISABLED: "false"
          probes:
            liveness:
              custom: true
              spec:
                httpGet:
                  path: /api/server/ping
                  port: http
                periodSeconds: 10
                timeoutSeconds: 5
                failureThreshold: 18

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: RollingUpdate
      rollingUpdate:
        surge: "0"
        unavailable: 1
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.1.0@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 4Gi
  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      size: 1Gi
      accessMode: ReadWriteOnce
      storageClass: longhorn-strict-local
