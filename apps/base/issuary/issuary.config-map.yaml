apiVersion: v1
kind: ConfigMap
metadata:
  name: issuary-config
  namespace: issuary-system
data:
  config.yaml: |
    server:
      public_origin: https://auth.winetree94.com
      listen_port: 8080
      trust_proxy: true

    frontend:
      enabled: true
      mode: static
      path: /opt/issuary/frontend
      html_variables:
        APP_NAME: Issuary

    logging:
      level: info
      format: json

    database:
      type: postgres
      host: issuary-database-cluster-rw.issuary-system.svc.cluster.local
      port: 5432
      user: ${ISSUARY_DATABASE_USER}
      password: ${ISSUARY_DATABASE_PASSWORD}
      name: issuary

    security:
      session_secret: ${ISSUARY_SESSION_SECRET}
      hash_secret: ${ISSUARY_HASH_SECRET}

    registration:
      enabled: false
      allowed_email_patterns: []
      email_verification_required: false

    auth:
      password:
        enabled: true
        two_factor:
          enrollment_required: true
        totp:
          enabled: true
      passkey:
        enabled: true
      account_selection:
        enabled: true
        mode: always
        remember_accounts:
          enabled: true
          max_accounts: 5
          ttl: 30d
        allow_add_account: true
        allow_remove_account: true
        login_hint:
          behavior: prefer
        prompt_none_error: account_selection_required

    terms: []

    clients:
      - id: 5f4d8c3b-2a1e-4b9f-8c7d-6e5a4f3b2c1d
        name: Homelab Test Client
        client_id: homelab-test-client
        client_secret: ${ISSUARY_TEST_CLIENT_SECRET:-homelab-test-secret}
        redirect_uris:
          - https://auth.winetree94.com/callback
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: openwebui
        name: OpenWebUI
        client_id: cM329FCwUpqO55pUrMWRjj4abLCeFVGIm7D7lm3B
        client_secret: ${ISSUARY_OPENWEBUI_CLIENT_SECRET}
        redirect_uris:
          - https://ai.winetree94.com/oauth/oidc/callback
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: beszel
        name: Beszel
        client_id: beszel
        client_secret: ${ISSUARY_BESZEL_CLIENT_SECRET}
        redirect_uris:
          - https://monitor.winetree94.com/api/oauth2-redirect
          - https://monitor.winetree94.com/
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: karakeep
        name: Karakeep
        client_id: msWzYbh6iiGSsEsdTx5yh9cYSsNgJsQjZ9om4RLl
        client_secret: ${ISSUARY_KARAKEEP_CLIENT_SECRET}
        redirect_uris:
          - https://bookmarks.winetree94.com/api/auth/callback/custom
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: immich
        name: Immich
        client_id: immich
        client_secret: ${ISSUARY_IMMICH_CLIENT_SECRET}
        redirect_uris:
          - https://photos.winetree94.com/auth/login
          - https://photos.winetree94.com/user-settings
          - https://photos.winetree94.com/api/oauth/mobile-redirect
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: guacamole
        name: Guacamole
        client_id: ZELLU6czGfaVxzpot16ChKxy31bMnQUdUDXoMAl8
        client_secret: ${ISSUARY_GUACAMOLE_CLIENT_SECRET}
        redirect_uris:
          - https://remote.intranet.winetree94.com/
        response_types:
          - code
          - id_token
        grant_types:
          - authorization_code
          - implicit
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: litellm
        name: LiteLLM Admin UI
        client_id: litellm-admin-ui
        client_secret: ${ISSUARY_LITELLM_CLIENT_SECRET}
        redirect_uris:
          - https://llm.winetree94.com/sso/callback
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email
        skip_consent: true
      - id: bulwark-webmail
        name: Bulwark Webmail
        client_id: bulwark-webmail
        client_secret: ${ISSUARY_BULWARK_WEBMAIL_CLIENT_SECRET}
        redirect_uris:
          - https://webmail.winetree94.com/cs/auth/callback
          - https://webmail.winetree94.com/da/auth/callback
          - https://webmail.winetree94.com/de/auth/callback
          - https://webmail.winetree94.com/en/auth/callback
          - https://webmail.winetree94.com/es/auth/callback
          - https://webmail.winetree94.com/fr/auth/callback
          - https://webmail.winetree94.com/it/auth/callback
          - https://webmail.winetree94.com/ja/auth/callback
          - https://webmail.winetree94.com/ko/auth/callback
          - https://webmail.winetree94.com/lv/auth/callback
          - https://webmail.winetree94.com/nl/auth/callback
          - https://webmail.winetree94.com/pl/auth/callback
          - https://webmail.winetree94.com/pt/auth/callback
          - https://webmail.winetree94.com/ru/auth/callback
          - https://webmail.winetree94.com/tr/auth/callback
          - https://webmail.winetree94.com/uk/auth/callback
          - https://webmail.winetree94.com/zh/auth/callback
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email offline_access
        skip_consent: true
      - id: stalwart-webui
        name: Stalwart WebUI
        client_id: stalwart-webui
        redirect_uris:
          - https://mail.winetree94.com/admin/oauth/callback
          - https://mail.winetree94.com/account/oauth/callback
        post_logout_redirect_uris:
          - https://mail.winetree94.com/admin/login
          - https://mail.winetree94.com/account/login
        web_origins:
          - https://mail.winetree94.com
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        scope: openid profile email offline_access
        skip_consent: true

    users: []

    identity_providers: []
