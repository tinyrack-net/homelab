apiVersion: batch/v1
kind: Job
metadata:
  name: issuary-database-rename
  namespace: issuary-system
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app: issuary-database-rename
    spec:
      restartPolicy: OnFailure
      containers:
        - name: rename
          image: ghcr.io/cloudnative-pg/postgresql:17.11-standard-bookworm@sha256:968fde04bca2be879ca14e1614a3987e149b77b42a51fe460fff252f3e145fce
          command:
            - /bin/sh
            - -ceu
            - |
              export PGHOST=issuary-database-cluster-rw.issuary-system.svc.cluster.local
              export PGPORT=5432
              export PGUSER="$SUPERUSER_NAME"
              export PGPASSWORD="$SUPERUSER_PASSWORD"
              export PGDATABASE=postgres

              old_database="$(psql -Atqc "SELECT count(*) FROM pg_database WHERE datname = 'tinyauth'")"
              new_database="$(psql -Atqc "SELECT count(*) FROM pg_database WHERE datname = 'issuary'")"
              if [ "$old_database" = 1 ] && [ "$new_database" = 1 ]; then
                echo "Both source and destination databases exist" >&2
                exit 1
              elif [ "$old_database" = 1 ]; then
                psql -v ON_ERROR_STOP=1 -c 'ALTER DATABASE tinyauth RENAME TO issuary'
              elif [ "$new_database" != 1 ]; then
                echo "Neither source nor destination database exists" >&2
                exit 1
              fi

              old_role="$(psql -Atqc "SELECT count(*) FROM pg_roles WHERE rolname = 'tinyauth'")"
              new_role="$(psql -Atqc "SELECT count(*) FROM pg_roles WHERE rolname = 'issuary'")"
              if [ "$old_role" = 1 ] && [ "$new_role" = 1 ]; then
                echo "Both source and destination roles exist" >&2
                exit 1
              elif [ "$old_role" = 1 ]; then
                psql -v ON_ERROR_STOP=1 -c 'ALTER ROLE tinyauth RENAME TO issuary'
              elif [ "$new_role" != 1 ]; then
                echo "Neither source nor destination role exists" >&2
                exit 1
              fi

              psql -v ON_ERROR_STOP=1 -c 'ALTER DATABASE issuary OWNER TO issuary'
              test "$(psql -Atqc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'issuary'")" = issuary

              export PGUSER="$APPLICATION_USER"
              export PGPASSWORD="$APPLICATION_PASSWORD"
              export PGDATABASE=issuary
              test "$(psql -Atqc 'SELECT current_user')" = issuary
          env:
            - name: SUPERUSER_NAME
              valueFrom:
                secretKeyRef:
                  name: issuary-database-superuser-secret
                  key: username
            - name: SUPERUSER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: issuary-database-superuser-secret
                  key: password
            - name: APPLICATION_USER
              valueFrom:
                secretKeyRef:
                  name: issuary-database-user-secret
                  key: username
            - name: APPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: issuary-database-user-secret
                  key: password
