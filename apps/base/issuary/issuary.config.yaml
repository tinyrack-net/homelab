server:
  public_origin: https://auth.winetree94.com
  listen_port: 8080
  trust_proxy: true

logging:
  level: info
  format: json

database:
  type: postgres
  host: issuary-database-cluster-rw.issuary-system.svc.cluster.local
  port: 5432
  user: ${ISSUARY_DATABASE_USER}
  password: ${ISSUARY_DATABASE_PASSWORD}
  name: issuary

security:
  session_secret: ${ISSUARY_SESSION_SECRET}
  hash_secret: ${ISSUARY_HASH_SECRET}

registration:
  enabled: false
  allowed_email_patterns: []
  email_verification_required: false

auth:
  password:
    enabled: true
    two_factor:
      enrollment_required: true
    totp:
      enabled: true
  passkey:
    enabled: true
  account_selection:
    enabled: true
    mode: always
    remember_accounts:
      enabled: true
      max_accounts: 5
      ttl: 30d
    allow_add_account: true
    allow_remove_account: true
    login_hint:
      behavior: prefer
    prompt_none_error: account_selection_required

terms: []

clients:
  - id: guacamole
    name: Apache Guacamole
    client_id: guacamole
    redirect_uris:
      - https://remote.intranet.winetree94.com/
    response_types:
      - id_token
    grant_types:
      - implicit
    scope: openid profile email
    skip_consent: true
  - id: home-assistant
    name: Home Assistant
    client_id: home-assistant
    redirect_uris:
      - https://home-assistant.winetree94.com/auth/oidc/callback
    response_types:
      - code
    grant_types:
      - authorization_code
    scope: openid profile email
    skip_consent: true
  - id: 5f4d8c3b-2a1e-4b9f-8c7d-6e5a4f3b2c1d
    name: Homelab Test Client
    client_id: homelab-test-client
    client_secret: ${ISSUARY_TEST_CLIENT_SECRET:-homelab-test-secret}
    redirect_uris:
      - https://auth.winetree94.com/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: openwebui
    name: OpenWebUI
    client_id: cM329FCwUpqO55pUrMWRjj4abLCeFVGIm7D7lm3B
    client_secret: ${ISSUARY_OPENWEBUI_CLIENT_SECRET}
    redirect_uris:
      - https://ai.winetree94.com/oauth/oidc/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: grafana
    name: Grafana
    client_id: grafana
    client_secret: ${ISSUARY_GRAFANA_CLIENT_SECRET}
    redirect_uris:
      - https://monitor.winetree94.com/login/generic_oauth
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: karakeep
    name: Karakeep
    client_id: msWzYbh6iiGSsEsdTx5yh9cYSsNgJsQjZ9om4RLl
    client_secret: ${ISSUARY_KARAKEEP_CLIENT_SECRET}
    redirect_uris:
      - https://bookmarks.winetree94.com/api/auth/callback/custom
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: immich
    name: Immich
    client_id: immich
    client_secret: ${ISSUARY_IMMICH_CLIENT_SECRET}
    redirect_uris:
      - https://photos.winetree94.com/auth/login
      - https://photos.winetree94.com/user-settings
      - https://photos.winetree94.com/api/oauth/mobile-redirect
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: nextcloud
    name: Nextcloud
    client_id: nextcloud
    client_secret: ${ISSUARY_NEXTCLOUD_CLIENT_SECRET}
    redirect_uris:
      - https://cloud.winetree94.com/apps/user_oidc/code
    # user_oidc가 로그아웃 시 end_session_endpoint로 보내는 기본
    # post_logout_redirect_uri는 urlGenerator->getAbsoluteURL('/') = 아래 값이다.
    # Issuary는 등록된 값과 완전 일치할 때만 허용하므로(정확 문자열 비교)
    # 슬래시까지 동일하게 등록해야 한다.
    post_logout_redirect_uris:
      - https://cloud.winetree94.com/
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  # nextcloud-mcp-server (Login Flow v2) as an OAuth proxy for MCP clients such
  # as Open WebUI. It requests the RFC 8707 resource below, so its access
  # tokens are also accepted by Nextcloud user_oidc bearer validation.
  # The app scopes mirror every scope the server knows (tool decorators and
  # nextcloud_mcp_server/models/auth.py); Issuary rejects the whole request
  # when any requested scope is missing here.
  - id: nextcloud-mcp
    name: Nextcloud MCP
    client_id: nextcloud-mcp
    client_secret: ${ISSUARY_NEXTCLOUD_MCP_CLIENT_SECRET}
    redirect_uris:
      - https://nextcloud-mcp.winetree94.com/oauth/callback
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: >-
      openid profile email offline_access
      calendar.read calendar.write collectives.read collectives.write
      contacts.read contacts.write cookbook.read cookbook.write
      deck.read deck.write files.read files.write
      mail.read mail.send mail.write news.read news.write notes.read notes.write
      sar.read sar.write semantic.read sharing.read sharing.write
      shopping_list.read shopping_list.write tables.read tables.write
      talk.read talk.write todo.read todo.write
    resources:
      - https://nextcloud-mcp.winetree94.com/mcp
    skip_consent: true
  - id: outline
    name: Outline
    client_id: outline
    client_secret: ${ISSUARY_OUTLINE_CLIENT_SECRET}
    redirect_uris:
      - https://notes.winetree94.com/auth/oidc.callback
    # Outline sends env.URL verbatim (no trailing slash) as
    # post_logout_redirect_uri, and Issuary compares exact strings.
    post_logout_redirect_uris:
      - https://notes.winetree94.com
      - https://notes.winetree94.com/
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    # Outline re-validates its session against the IdP token and signs the
    # user out once it expires without a refresh token. Issuary only issues
    # refresh tokens for offline_access, so it must be allowed here.
    scope: openid profile email offline_access
    skip_consent: true
  - id: mathesar
    name: Mathesar
    client_id: mathesar
    client_secret: ${ISSUARY_MATHESAR_CLIENT_SECRET}
    redirect_uris:
      - https://tables.intranet.winetree94.com/auth/oidc/issuary/login/callback/
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email
    skip_consent: true
  - id: stalwart-webui
    name: Stalwart WebUI
    client_id: stalwart-webui
    redirect_uris:
      - https://mail.winetree94.com/admin/oauth/callback
      - https://mail.winetree94.com/account/oauth/callback
    post_logout_redirect_uris:
      - https://mail.winetree94.com/admin/login
      - https://mail.winetree94.com/account/login
    web_origins:
      - https://mail.winetree94.com
    response_types:
      - code
    grant_types:
      - authorization_code
      - refresh_token
    scope: openid profile email offline_access
    skip_consent: true
# RFC 8707 protected resources. The MCP resource also carries the Nextcloud
# user_oidc client_id so Nextcloud accepts the same token as a bearer.
resources:
  - identifier: https://nextcloud-mcp.winetree94.com/mcp
    audiences:
      - https://nextcloud-mcp.winetree94.com/mcp
      - nextcloud

users: []

identity_providers: []
