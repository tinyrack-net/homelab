# nextcloud-mcp-server in Login Flow v2 mode.
#
# MCP clients (Open WebUI) authenticate to this server with OAuth 2.1. The
# server proxies the authorization to Issuary as the confidential client
# `nextcloud-mcp` and requests the RFC 8707 resource
# https://nextcloud-mcp.winetree94.com/mcp, so access tokens carry
# aud=[<that resource>, nextcloud]. The MCP server accepts the first audience;
# Nextcloud user_oidc (--check-bearer=1, client_id `nextcloud`) accepts the
# second, which the server needs to confirm that a Login Flow v2 grant belongs
# to the calling user. Nextcloud API calls use per-user app passwords stored
# encrypted in /app/data/tokens.db.
nextcloud:
  # Public URLs resolve to the internal traefik-external LoadBalancer inside the
  # cluster, so the Login Flow v2 URLs Nextcloud returns are browser-reachable.
  host: https://cloud.winetree94.com
  mcpServerUrl: https://nextcloud-mcp.winetree94.com
  # With an external IdP this is the token issuer, not Nextcloud.
  publicIssuerUrl: https://auth.winetree94.com

auth:
  mode: login-flow
  oidc:
    discoveryUrl: https://auth.winetree94.com/.well-known/openid-configuration
  loginFlow:
    # token_encryption_key, client_id, client_secret
    # (Bitwarden item 4fcab6a3-5f1c-40bf-83da-b4f2007ee9b0).
    existingSecret: nextcloud-mcp-secrets
    oidcExistingSecret: nextcloud-mcp-secrets

# tokens.db holds the encrypted per-user app passwords.
dataStorage:
  enabled: true
  storageClass: longhorn
  size: 1Gi

mcp:
  # Trust X-Forwarded-* from Traefik (pod CIDR).
  forwardedAllowIps: "10.61.0.0/16"

extraEnvApi:
  # External IdP: send Login Flow v2 links to Nextcloud, not to the issuer.
  - name: NEXTCLOUD_PUBLIC_URL
    value: https://cloud.winetree94.com
  # Open WebUI registers through DCR; this static entry makes /oauth/register
  # always return the same client for its callback, so the registration
  # survives server restarts. Server id `nextcloud` in Open WebUI.
  - name: ALLOWED_MCP_CLIENTS
    value: openwebui|https://ai.winetree94.com/oauth/clients/mcp:nextcloud/callback
  # Browsers only reach this server through redirects; Open WebUI calls it
  # server-side. Do not leave the credentialed CORS wildcard open.
  - name: CORS_ALLOW_ORIGINS
    value: https://ai.winetree94.com

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
