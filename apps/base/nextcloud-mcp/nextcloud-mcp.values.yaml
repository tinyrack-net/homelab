# nextcloud-mcp-server in single-user BasicAuth mode for Open WebUI.
#
# Every request runs as one Nextcloud account (me@winetree94.com) with a
# dedicated app password, and the MCP endpoint itself has NO authentication.
# Keep it in-cluster only: there is no IngressRoute or public hostname, and the
# Cilium policy admits only the Open WebUI pods. Open WebUI connects to
# http://nextcloud-mcp-nextcloud-mcp-server.nextcloud-mcp-system.svc.cluster.local:8000/mcp
# and the connection must stay Private there, since anyone allowed to use it
# acts as this account.
nextcloud:
  # The public hostname resolves to the internal traefik-external LoadBalancer.
  host: https://cloud.winetree94.com

auth:
  mode: basic
  basic:
    # username (Nextcloud UID) and password (app password
    # "nextcloud-mcp-server (homelab single-user)"),
    # Bitwarden item 4fcab6a3-5f1c-40bf-83da-b4f2007ee9b0.
    existingSecret: nextcloud-mcp-secrets

mcp:
  # Trust X-Forwarded-* only from pods.
  forwardedAllowIps: "10.61.0.0/16"

extraEnvApi:
  # Only Open WebUI's backend calls this server; do not leave the credentialed
  # CORS wildcard open.
  - name: CORS_ALLOW_ORIGINS
    value: https://ai.winetree94.com

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
