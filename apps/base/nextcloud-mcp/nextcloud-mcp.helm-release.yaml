apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-mcp-helm-release
  namespace: nextcloud-mcp-system
spec:
  releaseName: nextcloud-mcp
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: nextcloud-mcp-server
      version: "0.105.23"
      sourceRef:
        kind: HelmRepository
        name: nextcloud-mcp-repository
        namespace: flux-system
  # The chart always renders its appVersion as the image tag, so pin the
  # platform digest here.
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/cbcoutinho/nextcloud-mcp-server
            newTag: 0.210.0
            digest: sha256:99d856383ec23dca9bf25923b9621ae067b5e2b12829780dfa47c630afd4ab6d
  valuesFrom:
    - kind: ConfigMap
      name: nextcloud-mcp-values
      valuesKey: values.yaml
