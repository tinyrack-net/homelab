apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud-mcp-helm-release
  namespace: nextcloud-mcp-system
spec:
  releaseName: nextcloud-mcp
  interval: 5m
  timeout: 10m
  chart:
    spec:
      chart: nextcloud-mcp-server
      version: "0.105.16"
      sourceRef:
        kind: HelmRepository
        name: nextcloud-mcp-repository
        namespace: flux-system
  # The chart always renders its appVersion as the image tag, so pin the
  # platform digest here.
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/cbcoutinho/nextcloud-mcp-server
            newTag: 0.203.0
            digest: sha256:af1034fe7c330b873d75527f78f5654cbf68700851b47862c281664d8610046c
  valuesFrom:
    - kind: ConfigMap
      name: nextcloud-mcp-values
      valuesKey: values.yaml
