# Bearer API key gate in front of nextcloud-mcp-server (single-user mode, no
# authentication of its own). The accepted key lives in the
# nextcloud-mcp-gateway-secrets SealedSecret as an nginx map entry:
#   "Bearer <key>" 1;
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format main escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for","method":"$request_method",'
    '"uri":"$uri","status":$status,"authorized":"$mcp_authorized",'
    '"request_time":$request_time,"user_agent":"$http_user_agent"}';
  access_log /dev/stdout main;
  server_tokens off;

  map $http_authorization $mcp_authorized {
    default 0;
    include /etc/nginx/secret/api-keys.conf;
  }

  upstream nextcloud_mcp {
    server nextcloud-mcp-nextcloud-mcp-server.nextcloud-mcp-system.svc.cluster.local:8000;
    keepalive 16;
  }

  server {
    listen 8080;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    location / {
      if ($mcp_authorized = 0) {
        add_header WWW-Authenticate 'Bearer realm="nextcloud-mcp"' always;
        return 401;
      }

      proxy_pass http://nextcloud_mcp;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      # The key is for this gate only; never forward it upstream.
      proxy_set_header Authorization "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      # Streamable HTTP responses are SSE streams.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      client_max_body_size 64m;
    }
  }
}
