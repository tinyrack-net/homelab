apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-mcp-ingress-route
  namespace: nextcloud-mcp-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`nextcloud-mcp.winetree94.com`)
      kind: Rule
      services:
        - name: nextcloud-mcp-nextcloud-mcp-server
          port: 8000
  tls:
    secretName: letsencrypt-cert
