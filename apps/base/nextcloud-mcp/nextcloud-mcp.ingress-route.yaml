# Internal only: *.intranet.winetree94.com resolves to internal Traefik on the
# LAN, WireGuard and Tailscale; there is no Cloudflare route for this host.
# Requests go through nextcloud-mcp-gateway, which checks the Bearer API key.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nextcloud-mcp
  namespace: nextcloud-mcp-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`me.mcp.nextcloud.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: nextcloud-mcp-gateway
          port: 8080
  tls:
    secretName: letsencrypt-cert
