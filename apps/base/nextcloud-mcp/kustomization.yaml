apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - nextcloud-mcp.namespace.yaml
  - nextcloud-mcp.secret.yaml
  - nextcloud-mcp.helm-release.yaml
  - nextcloud-mcp.cilium-network-policy.yaml
  - nextcloud-mcp.gateway.secret.yaml
  - nextcloud-mcp.gateway.yaml
  - nextcloud-mcp.ingress-route.yaml
  - nextcloud-mcp.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: nextcloud-mcp-values
    namespace: nextcloud-mcp-system
    files:
      - values.yaml=nextcloud-mcp.values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
  - name: nextcloud-mcp-gateway-config
    namespace: nextcloud-mcp-system
    files:
      - nginx.conf=nextcloud-mcp.gateway.nginx.conf
