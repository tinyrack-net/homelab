apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-forgejo
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: forgejo
  annotations:
    networking.tinyrack.net/hosts: git.winetree94.com
spec:
  description: Allow the git.winetree94.com route and Forgejo's OIDC calls to Issuary
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo-system
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: forgejo-system
            serviceName: forgejo-http
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-forgejo
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: forgejo
  annotations:
    networking.tinyrack.net/hosts: storage.intranet.winetree94.com
spec:
  description: Allow Forgejo object storage and database backups to reach Garage S3
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo-system
            app.kubernetes.io/name: forgejo
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: forgejo-system
            cnpg.io/cluster: forgejo-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
