apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - forgejo.admin.secret.yaml
  - forgejo.oauth.secret.yaml
  - forgejo.env.secret.yaml
  - forgejo.pvc.yaml
  - forgejo.helm-release.yaml
  - forgejo.ingress-route.yaml
  - forgejo.cilium-network-policy.yaml
  - forgejo.traefik.cilium-network-policy.yaml
configMapGenerator:
  # Branding and portfolio customization, mounted under GITEA_CUSTOM
  # (/data/gitea) by values.yaml. Edit the files in ./custom.
  - name: forgejo-custom
    namespace: forgejo-system
    files:
      - custom/logo.svg
      - custom/favicon.png
      - custom/apple-touch-icon.png
      - custom/theme-winetree94-light.css
      - custom/theme-winetree94-dark.css
      - custom/theme-winetree94-auto.css
      - custom/header.tmpl
      - custom/extra_links.tmpl
      - custom/extra_links_footer.tmpl
    options:
      # Referenced by a fixed name from values.yaml. Templates and assets are
      # loaded at startup, so bump gitea.podAnnotations
      # forgejo.tinyrack.net/custom-revision after editing ./custom.
      disableNameSuffixHash: true
  - name: forgejo-values
    namespace: forgejo-system
    files:
      - values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
