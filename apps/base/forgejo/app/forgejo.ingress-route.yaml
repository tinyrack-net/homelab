apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: forgejo
  namespace: forgejo-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`git.winetree94.com`)
      kind: Rule
      services:
        - name: forgejo-http
          port: 3000
  tls:
    secretName: letsencrypt-cert
