apiVersion: v1
kind: Service
metadata:
  name: browseros-neo-gui
  namespace: browseros-personal-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: browseros-neo
  ports:
    - name: gui
      port: 5800
      protocol: TCP
      targetPort: gui
---
apiVersion: v1
kind: Service
metadata:
  name: browseros-neo-mcp
  namespace: browseros-personal-system
  labels:
    networking.tinyrack.net/load-balancer: cilium-l2
  annotations:
    lbipam.cilium.io/ips: "10.132.246.6"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: browseros-neo
  ports:
    - name: mcp
      port: 9300
      protocol: TCP
      targetPort: mcp
