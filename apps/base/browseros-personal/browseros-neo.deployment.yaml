apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseros-neo
  namespace: browseros-personal-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: browseros-neo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browseros-neo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # Chromium's sandbox needs unprivileged user namespaces, which the
        # runtime default seccomp and AppArmor profiles block.
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      containers:
        - name: browseros-neo
          image: ghcr.io/tinyrack-net/browseros-neo:0.51.1.2@sha256:ad540101b15a9246a25b66c6380a088669a979b907e39c4c2522e33c4279d99b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Seoul
            - name: USER_ID
              value: "1000"
            - name: GROUP_ID
              value: "1000"
            - name: BROWSER_SANDBOX
              value: auto
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browseros-neo-mcp
                  key: MCP_AUTH_TOKEN
          ports:
            - name: gui
              containerPort: 5800
              protocol: TCP
            - name: mcp
              containerPort: 9300
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            tcpSocket:
              port: gui
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: gui
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: browseros-neo-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
