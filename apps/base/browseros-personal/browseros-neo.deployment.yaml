apiVersion: apps/v1
kind: Deployment
metadata:
  name: browseros-neo
  namespace: browseros-personal-system
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: browseros-neo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browseros-neo
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        # Chromium's sandbox needs unprivileged user namespaces. The node
        # restricts them to programs with an AppArmor profile
        # (kernel.apparmor_restrict_unprivileged_userns=1), so the pod requests
        # Ubuntu's stock `chrome` profile, which grants userns and nothing
        # else, plus an unconfined seccomp profile.
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Localhost
          localhostProfile: chrome
      containers:
        - name: browseros-neo
          image: ghcr.io/tinyrack-net/browseros-neo:0.51.1.2@sha256:dcd46559063a4fe0428f0d420e7f1b2f4cb2fda72cce3c5bd1a2450745fe3c6b
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Asia/Seoul
            - name: USER_ID
              value: "1000"
            - name: GROUP_ID
              value: "1000"
            - name: BROWSER_SANDBOX
              value: auto
            # The image serves the web GUI and MCP on one port by default. Keep
            # them apart here: the GUI goes through Traefik, while MCP has its
            # own LoadBalancer IP restricted to internal networks.
            - name: WEB_LISTENING_PORT
              value: "5800"
            - name: MCP_LISTENING_PORT
              value: "9300"
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: browseros-neo-mcp
                  key: MCP_AUTH_TOKEN
            # Login page in front of the web GUI. TLS terminates at Traefik, so the
            # container serves plain HTTP inside the cluster.
            - name: WEB_AUTHENTICATION
              value: "1"
            - name: WEB_AUTHENTICATION_ALLOW_INSECURE
              value: "1"
            - name: WEB_AUTHENTICATION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: browseros-neo-web
                  key: WEB_AUTHENTICATION_USERNAME
            - name: WEB_AUTHENTICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: browseros-neo-web
                  key: WEB_AUTHENTICATION_PASSWORD
          ports:
            - name: gui
              containerPort: 5800
              protocol: TCP
            - name: mcp
              containerPort: 9300
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          startupProbe:
            tcpSocket:
              port: gui
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: gui
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: mcp
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: browseros-neo-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
