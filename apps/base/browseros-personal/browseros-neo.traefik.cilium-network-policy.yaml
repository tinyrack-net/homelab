apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-browseros-personal
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: browseros-personal
  annotations:
    networking.tinyrack.net/hosts: personal.browseros.intranet.winetree94.com
spec:
  description: Allow the internal BrowserOS neo (personal) web GUI route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: browseros-personal-system
            serviceName: browseros-neo-gui
      toPorts:
        - ports:
            - port: "5800"
              protocol: TCP
