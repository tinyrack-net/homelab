apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-devenv
  namespace: devenv-system
spec:
  description: devenv server - web console via internal Traefik, Kubernetes API, environment pods
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: devenv-system
      app.kubernetes.io/name: devenv
  ingress:
    # Web console via internal Traefik; MCP (/mcp) from Bifrost.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # SSH gateway LoadBalancer (10.132.246.6) for LAN, VPN and Tailscale clients.
    - fromCIDRSet:
        - cidrGroupRef: lan
        - cidrGroupRef: vpn-server
        - cidrGroupRef: vpn-control
        - cidrGroupRef: tailscale
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
  egress:
    # State database (CloudNativePG).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv-system
            cnpg.io/cluster: devenv-database-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OIDC discovery and token calls to Issuary (auth.winetree94.com resolves
    # to the traefik-external LoadBalancer).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-external-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # SSH to environments (gateway, web terminal, VNC tunnel).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv
            devenv.tinyrack.net/component: workspace
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-devenv-database
  namespace: devenv-system
spec:
  description: devenv database - clients, CNPG operator, replication and backups to Garage
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: devenv-system
      cnpg.io/cluster: devenv-database-cluster
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv-system
            app.kubernetes.io/name: devenv
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cnpg-system
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "9187"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv-system
            cnpg.io/cluster: devenv-database-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv-system
            cnpg.io/cluster: devenv-database-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Base backups and WAL to Garage through the internal Traefik.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-devenv-environments
  namespace: devenv
spec:
  description: Development environments - reachable from the devenv server, may reach the LAN
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: devenv
      devenv.tinyrack.net/component: workspace
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devenv-system
            app.kubernetes.io/name: devenv
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
  egress:
    # Development work reaches LAN hosts, VPN clients and Tailscale, like a
    # workstation. DNS and the public internet come from the
    # isolated-namespaces clusterwide policy. The Kubernetes node itself and
    # in-cluster pods stay blocked.
    - toCIDRSet:
        - cidrGroupRef: lan
        - cidrGroupRef: vpn-server
        - cidrGroupRef: vpn-control
        - cidrGroupRef: tailscale
    # Intranet and public homelab services through Traefik, the same way LAN
    # clients reach them (their LoadBalancer IPs resolve to the pods).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-external-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
