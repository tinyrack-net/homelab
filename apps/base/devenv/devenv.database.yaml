apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: devenv-database-backup-store-pg18
  namespace: devenv-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/devenv/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
# devenv state (users, environments, keys, tokens). Home volumes are backed
# up by Longhorn. A rebuilt cluster recovers from the barman backups.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: devenv-database-cluster
  namespace: devenv-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:ff50547e391c0df0ff64726962e816effcfd85b4ea42040a70cc502e8ff45d49
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: devenv-database-backup-store-pg18
        serverName: devenv-database-pg18
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  externalClusters:
    - name: devenv-database-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: devenv-database-backup-store-pg18
          serverName: devenv-database-pg18
  bootstrap:
    recovery:
      source: devenv-database-recovery-source
      database: devenv
      owner: devenv
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: devenv-backup
  namespace: devenv-system
spec:
  schedule: "0 0 12 * * *"  # daily 21:00 KST, before borgmatic (WAL keeps PITR)
  backupOwnerReference: self
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: devenv-database-cluster
