apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-devenv
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: devenv
  annotations:
    networking.tinyrack.net/hosts: devenv.intranet.winetree94.com
spec:
  description: Allow the devenv.intranet.winetree94.com route
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: devenv-system
            serviceName: devenv
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
