apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devenv
  namespace: devenv-system
spec:
  interval: 5m
  timeout: 5m
  releaseName: devenv
  targetNamespace: devenv-system
  storageNamespace: devenv-system
  chartRef:
    kind: OCIRepository
    name: devenv-repository
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  values:
    environments:
      namespace: devenv
      createNamespace: false
      quota:
        requests.cpu: "16"
        requests.memory: 48Gi
        requests.storage: 500Gi
    secureCookies: true
    externalURL: https://devenv.intranet.winetree94.com
    # SSH gateway: ssh -p 2222 <env>@devenv.intranet.winetree94.com is not
    # possible through Traefik (HTTP only), so it gets its own LAN IP.
    sshService:
      type: LoadBalancer
      port: 2222
      publicHost: 10.132.246.6
      externalTrafficPolicy: Local
      labels:
        networking.tinyrack.net/load-balancer: cilium-l2
      annotations:
        lbipam.cilium.io/ips: "10.132.246.6"
    defaultClass:
      spec:
        storage:
          mode: persistent
          storageClassName: longhorn
          defaultSize: 20Gi
        network:
          mode: gateway
        limits:
          maxCPU: "8"
          maxMemory: 16Gi
          maxDisk: 200Gi
    extraClasses:
      # Dedicated LAN IP from OPNsense DHCP; every port is reachable from the
      # LAN. The secondary interface bypasses Cilium policies.
      lan:
        storage:
          mode: persistent
          storageClassName: longhorn
          defaultSize: 20Gi
        network:
          mode: multus
          multus:
            networkAttachment: devenv/lan-dhcp
            stableMAC: true
        limits:
          maxCPU: "8"
          maxMemory: 16Gi
          maxDisk: 200Gi
