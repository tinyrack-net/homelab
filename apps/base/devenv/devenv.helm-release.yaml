apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: devenv
  namespace: devenv-system
spec:
  interval: 5m
  timeout: 5m
  releaseName: devenv
  targetNamespace: devenv-system
  storageNamespace: devenv-system
  chartRef:
    kind: OCIRepository
    name: devenv-repository
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 0
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 0
  values:
    environments:
      namespace: devenv
      createNamespace: false
      quota:
        requests.cpu: "16"
        requests.memory: 48Gi
        requests.storage: 500Gi
    secureCookies: true
    externalURL: https://devenv.intranet.winetree94.com
    auth:
      # The local admin stays as a fallback; everyday login is Issuary.
      admins:
        - me@winetree94.com
      oidc:
        - id: issuary
          name: Issuary
          issuer: https://auth.winetree94.com
          clientID: devenv
          existingSecret: devenv-oidc
    # SSH gateway: ssh -p 2222 <env>@devenv.intranet.winetree94.com is not
    # possible through Traefik (HTTP only), so it gets its own LAN IP.
    sshService:
      type: LoadBalancer
      port: 2222
      publicHost: 10.132.246.6
      externalTrafficPolicy: Local
      labels:
        networking.tinyrack.net/load-balancer: cilium-l2
      annotations:
        lbipam.cilium.io/ips: "10.132.246.6"
    # Daily export of users, environments and keys to Garage; home volumes
    # are backed up by Longhorn (class storage labels below).
    backup:
      enabled: true
      schedule: "45 3 * * *"
      dest: s3://tinyrack-homelab/apps/devenv/metadata
      keep: 14
      s3:
        endpoint: https://storage.intranet.winetree94.com
        region: home
        existingSecret: tinyrack-homelab-s3-secret
    defaultClass:
      spec:
        storage:
          mode: persistent
          storageClassName: longhorn
          defaultSize: 20Gi
          labels:
            recurring-job-group.longhorn.io/longhorn-backup: enabled
        network:
          mode: gateway
        limits:
          maxCPU: "8"
          maxMemory: 16Gi
          maxDisk: 200Gi
    extraClasses:
      # Dedicated LAN IP from OPNsense DHCP; every port is reachable from the
      # LAN. The secondary interface bypasses Cilium policies.
      lan:
        storage:
          mode: persistent
          storageClassName: longhorn
          defaultSize: 20Gi
          labels:
            recurring-job-group.longhorn.io/longhorn-backup: enabled
        network:
          mode: multus
          multus:
            networkAttachment: devenv/lan-dhcp
            stableMAC: true
        limits:
          maxCPU: "8"
          maxMemory: 16Gi
          maxDisk: 200Gi
