fullnameOverride: open-webui
tika:
  enabled: true
  image:
    tag: 3.3.1.0-full
  resources:
    requests:
      cpu: 250m
      memory: 1500Mi
    limits:
      cpu: "2"
      memory: 2000Mi
ollama:
  enabled: false
pipelines:
  enabled: false
websocket:
  enabled: true
  redis:
    enabled: true
terminals:
  enabled: false
replicaCount: 2
podLabels:
  observability.tinyrack.net/otlp-client: "true"
persistence:
  enabled: false
  provider: s3
  s3:
    accessKeyExistingSecret: tinyrack-homelab-s3-secret
    accessKeyExistingAccessKey: AWS_ACCESS_KEY_ID
    secretKeyExistingSecret: tinyrack-homelab-s3-secret
    secretKeyExistingSecretKey: AWS_SECRET_ACCESS_KEY
    endpointUrl: "https://storage.intranet.winetree94.com"
    region: "home"
    bucket: "tinyrack-homelab-openwebui-storage"
sso:
  enabled: true
  enableSignup: true
  mergeAccountsByEmail: true
  oidc:
    clientExistingSecret: openwebui-oauth-secret
    clientExistingSecretKey: client_secret
    clientId: cM329FCwUpqO55pUrMWRjj4abLCeFVGIm7D7lm3B
    enabled: true
    providerName: "Issuary"
    providerUrl: "https://auth.winetree94.com/oauth/.well-known/openid-configuration"
extraEnvVars:
  # OpenTelemetry
  - name: ENABLE_OTEL
    value: "true"
  - name: ENABLE_OTEL_TRACES
    value: "true"
  - name: ENABLE_OTEL_METRICS
    value: "false"
  - name: ENABLE_OTEL_LOGS
    value: "false"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: http://monitoring-alloy.monitoring-system.svc.cluster.local:4318/v1/traces
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_OTLP_SPAN_EXPORTER
    value: http
  - name: OTEL_EXPORTER_OTLP_INSECURE
    value: "true"
  - name: OTEL_SERVICE_NAME
    value: open-webui
  - name: OTEL_RESOURCE_ATTRIBUTES
    value: deployment.environment.name=production,service.version=0.11.3
  - name: OTEL_TRACES_SAMPLER
    value: parentbased_always_on
  - name: OTEL_SDK_DISABLED
    value: "false"
  # DB
  - name: DATABASE_USER
    valueFrom:
      secretKeyRef:
        name: openwebui-database-user-secret
        key: username
  - name: DATABASE_PASSWORD
    valueFrom:
      secretKeyRef:
        name: openwebui-database-user-secret
        key: password
  - name: DATABASE_URL
    value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@openwebui-database-cluster-rw.openwebui-system.svc.cluster.local:5432/openwebui?sslmode=disable"
  # Redis
  # OIDC
  - name: OPENID_REDIRECT_URI
    value: "https://ai.winetree94.com/oauth/oidc/callback"
  - name: OAUTH_CODE_CHALLENGE_METHOD
    value: "S256"
  - name: OAUTH_TOKEN_ENDPOINT_AUTH_METHOD
    value: "client_secret_post"
  - name: WEBUI_URL
    value: "https://ai.winetree94.com"
  # AUTH
  - name: ENABLE_LOGIN_FORM
    value: "false"
  - name: ENABLE_SIGNUP
    value: "false"
  # CONFIG
  - name: BYPASS_MODEL_ACCESS_CONTROL
    value: "false"
  - name: ENABLE_FORWARD_USER_INFO_HEADERS
    value: "True"
  - name: WEBUI_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: openwebui-secret
        key: secret-key
