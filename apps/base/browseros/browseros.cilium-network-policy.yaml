apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-browseros
  namespace: browseros-system
specs:
  # The browser instances only accept traffic from the internal Traefik, which
  # serves both the web GUI and the MCP endpoint. Everything else (DNS, public
  # internet) comes from the isolated-namespaces clusterwide policy.
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: browseros-system
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "9300"
                protocol: TCP
    egress:
      # The LAN, which also carries the internal Traefik LoadBalancer IP that
      # serves the intranet applications.
      - toCIDRSet:
          - cidrGroupRef: lan
      # Internal Traefik itself, in case the service translation resolves the
      # LoadBalancer IP to the traefik pods before the policy is evaluated.
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # WireGuard VPN and Tailscale ranges.
      - toCIDRSet:
          - cidrGroupRef: vpn-server
          - cidrGroupRef: vpn-control
          - cidrGroupRef: tailscale
      # No port restriction: a general-purpose browser reaches arbitrary hosts
      # and ports. In-cluster pod and service ranges stay blocked and must be
      # allowed per endpoint or service when a browser task needs them.
  # The Vivident browser works on Vivident's intranet sites and devices (*.k8s.intranet.moelive.tech,
  # office routers and switches), all inside the Vivident ranges. The personal browser stays out.
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: browseros-system
        app: browseros-vivident
    egress:
      - toCIDRSet:
          - cidrGroupRef: vivident-intranet
