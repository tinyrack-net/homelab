apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browseros-personal-data
  namespace: browseros-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/name: browseros-neo
    app.kubernetes.io/instance: personal
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/longhorn-backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: longhorn-strict-local
  volumeMode: Filesystem
