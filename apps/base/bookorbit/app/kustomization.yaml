apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - bookorbit.secrets.yaml
  - bookorbit.deployment.yaml
  - bookorbit.service.yaml
  - bookorbit.ingress-route.yaml
  - bookorbit.cilium-network-policy.yaml
  - bookorbit.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: bookorbit-config
    namespace: bookorbit-system
    envs:
      - bookorbit.env
