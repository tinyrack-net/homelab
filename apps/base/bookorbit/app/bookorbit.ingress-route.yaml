apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bookorbit
  namespace: bookorbit-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`books.winetree94.com`)
      kind: Rule
      services:
        - name: bookorbit
          port: 3000
  tls:
    secretName: letsencrypt-cert
