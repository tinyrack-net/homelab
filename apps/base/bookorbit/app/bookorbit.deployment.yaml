apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: bookorbit-system
  labels:
    app.kubernetes.io/name: bookorbit
spec:
  replicas: 1
  # Database migrations run on startup; never run two versions side by side.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bookorbit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookorbit
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The entrypoint only fixes ownership under /data. Hand the JuiceFS
        # library root (owned by root when formatted) to the runtime user so
        # uploads, Book Dock imports and metadata write-back work.
        - name: library-permissions
          image: ghcr.io/bookorbit/bookorbit:3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown 1000:1000 /books"]
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: library
              mountPath: /books
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:3.8.0@sha256:d318f7732f6f6330312e2c5f854f7899f858b54cc4b18a13cde1f43b5bea0515
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: bookorbit-config
            - secretRef:
                name: bookorbit-secrets
          # Mirrors the upstream compose hardening: start as root for the
          # ownership fix, then su-exec drops to PUID:PGID.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: library
              mountPath: /books
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-app-data
        - name: library
          persistentVolumeClaim:
            claimName: bookorbit-library
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
