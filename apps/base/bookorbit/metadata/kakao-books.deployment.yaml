# BookOrbit external metadata provider for Korean books (Kakao Book Search
# API), from github.com/tinyrack-net/bookorbit-korean-provider. Stateless and
# reached only from BookOrbit; registered in Settings > Metadata > Providers
# as http://kakao-books.bookorbit-system.svc.cluster.local:8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kakao-books
  namespace: bookorbit-system
  labels:
    app.kubernetes.io/name: kakao-books
    app.kubernetes.io/part-of: bookorbit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kakao-books
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kakao-books
        app.kubernetes.io/part-of: bookorbit
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kakao-books
          image: ghcr.io/tinyrack-net/bookorbit-korean-provider:0.1.1@sha256:fcfcc6cbf159bb412f7891f30a507de08c433e27389febf09a1fbb6644cca19d # {"$imagepolicy": "flux-system:bookorbit-korean-provider"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KAKAO_REST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kakao-books-secret
                  key: KAKAO_REST_API_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /provider/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /provider/info
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kakao-books
  namespace: bookorbit-system
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kakao-books
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
