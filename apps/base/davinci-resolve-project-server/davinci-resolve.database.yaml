apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: davinci-resolve-database-backup-store
  namespace: davinci-resolve-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/davinci-resolve/database-13
    endpointURL: https://storage.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: davinci-resolve-database-backup-store-pg18
  namespace: davinci-resolve-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/davinci-resolve/database-18
    endpointURL: https://storage.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: davinci-resolve-database-cluster
  namespace: davinci-resolve-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:cdb5c283a473507f7c597ea7e045d1a5e8efcbc4c5101aada013af9bd37ccc43
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: davinci-resolve-database-backup-store-pg18
        serverName: davinci-resolve-database-pg18
  managed:
    services:
      additional:
        - selectorType: rw
          serviceTemplate:
            metadata:
              name: davinci-resolve-additional-lb
              labels:
                networking.tinyrack.net/load-balancer: cilium-l2
              annotations:
                lbipam.cilium.io/ips: "10.132.246.3"
            spec:
              type: LoadBalancer
              externalTrafficPolicy: Cluster
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  externalClusters:
    - name: davinci-resolve-database-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: davinci-resolve-database-backup-store-pg18
          serverName: davinci-resolve-database-pg18

  enableSuperuserAccess: true
  superuserSecret:
    name: davinci-resolve-database-superuser-secret

  bootstrap:
    recovery:
      source: davinci-resolve-database-recovery-source
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: davinci-resolve-backup
  namespace: davinci-resolve-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: davinci-resolve-database-cluster
