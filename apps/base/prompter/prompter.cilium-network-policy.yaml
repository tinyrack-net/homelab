apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-prompter
  namespace: prompter-system
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      k8s:io.kubernetes.pod.namespace: prompter-system
      app: prompter
  ingress:
    # Browsers and Outline's webhook deliveries arrive through internal Traefik.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Outline API, in-cluster.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: outline-system
            app.kubernetes.io/name: outline
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
