# Internal only: *.intranet.winetree94.com resolves to internal Traefik on
# the LAN and over VPN; there is no Cloudflare route for this host. The app has
# no authentication, so it must never be exposed publicly.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: prompter
  namespace: prompter-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`prompter.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: prompter
          port: 8080
          scheme: http
  tls:
    secretName: letsencrypt-cert
