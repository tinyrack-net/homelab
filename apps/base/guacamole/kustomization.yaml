apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - guacamole.namespace.yaml
  - guacamole.network-attachment.yaml
  - guacamole.database.user.secret.yaml
  - guacamole.database.superuser.secret.yaml
  - guacamole.database.yaml
  - guacamole.database-init.yaml
  - guacd.deployment.yaml
  - guacd.service.yaml
  - guacamole.deployment.yaml
  - guacamole.service.yaml
  - guacamole.ingress-route.yaml
  - guacamole.cilium-network-policy.yaml
  - guacamole.traefik.cilium-network-policy.yaml
configMapGenerator:
  - name: guacamole-database-schema
    namespace: guacamole-system
    files:
      - 001-create-schema.sql=guacamole.postgresql.schema.sql
