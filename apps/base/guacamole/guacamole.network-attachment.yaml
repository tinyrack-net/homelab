apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: guacamole-lan
  namespace: guacamole-system
spec:
  config: |- 
    {
      "cniVersion": "1.0.0",
      "type": "macvlan",
      "master": "enp6s18",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "10.132.246.254/22"
          }
        ]
      }
    }
