apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-guacamole
  namespace: guacamole-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: guacamole-system
        app: guacamole
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: guacamole-system
              app: guacd
        toPorts:
          - ports:
              - port: "4822"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: guacamole-system
              cnpg.io/cluster: guacamole-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      - toEntities:
          - world
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      # Guacamole OIDC discovery through the traefik-external LoadBalancer IP.
      - toCIDRSet:
          - cidrGroupRef: traefik-external
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP # HTTPS
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: guacamole-system
        app: guacd
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: guacamole-system
              app: guacamole
        toPorts:
          - ports:
              - port: "4822"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      # Remote desktop and Wake-on-LAN access to LAN hosts.
      - toCIDRSet:
          - cidrGroupRef: lan
        toPorts:
          - ports:
              - port: "22"
                protocol: TCP # SSH
              - port: "3389"
                protocol: TCP # RDP
              - port: "5900"
                protocol: TCP # VNC display :0
              - port: "5901"
                protocol: TCP # VNC display :1
              - port: "5902"
                protocol: TCP # VNC display :2
              - port: "5903"
                protocol: TCP # VNC display :3
              - port: "5904"
                protocol: TCP # VNC display :4
              - port: "5905"
                protocol: TCP # VNC display :5
              - port: "9"
                protocol: UDP # Wake-on-LAN
      - toEntities:
          - world
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: guacamole-system
        cnpg.io/cluster: guacamole-database-cluster
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: guacamole-system
              app: guacamole
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
              - port: "9187"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-guacamole-database-backup
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: guacamole
  annotations:
    networking.tinyrack.net/hosts: storage.intranet.winetree94.com
spec:
  description: Allow the Guacamole database to reach object storage through internal Traefik
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: guacamole-system
            cnpg.io/cluster: guacamole-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
