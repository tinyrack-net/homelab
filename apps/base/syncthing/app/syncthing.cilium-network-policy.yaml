apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-syncthing
  namespace: syncthing-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: syncthing-system
        app: syncthing
    ingress:
      # Web UI through internal Traefik.
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8384"
                protocol: TCP
      # LAN peers and local discovery. The macvlan interface is not managed by
      # Cilium, so this documents intent rather than enforcing it.
      - fromCIDRSet:
          - cidrGroupRef: lan
        toPorts:
          - ports:
              - port: "8384"
                protocol: TCP
              - port: "22000"
                protocol: TCP
              - port: "22000"
                protocol: UDP
              - port: "21027"
                protocol: UDP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP
      # Direct connections to LAN peers.
      - toCIDRSet:
          - cidrGroupRef: lan
      # Global discovery and relays.
      - toEntities:
          - world
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
              - port: "22067"
                protocol: TCP
              - port: "22067"
                protocol: UDP
