apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: syncthing-juicefs
provisioner: csi.juicefs.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: syncthing-juicefs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: syncthing-system
  csi.storage.k8s.io/node-publish-secret-name: syncthing-juicefs-secret
  csi.storage.k8s.io/node-publish-secret-namespace: syncthing-system
mountOptions:
  - cache-dir=/var/lib/jfs-cache
  - cache-size=51200
  - free-space-ratio=0.2
  - buffer-size=200
  - put-timeout=3600
  - max-uploads=2
  - upload-delay=10s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data
  namespace: syncthing-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    storage.tinyrack.net/profile: syncthing
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  storageClassName: syncthing-juicefs
  volumeMode: Filesystem
