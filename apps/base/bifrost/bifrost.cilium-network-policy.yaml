apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-bifrost
  namespace: bifrost-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: bifrost-system
        app: bifrost
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring-system
              app.kubernetes.io/name: alloy
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      # Outbound to internal & external Traefik pods directly
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # Egress to LAN LoadBalancer IPs
      - toCIDRSet:
          - cidrGroupRef: traefik-external
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      # Egress to Vivident intranet
      - toCIDRSet:
          - cidrGroupRef: vivident-intranet
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: mcp.winetree94.com
spec:
  description: Allow the mcp.winetree94.com route to reach bifrost-service and bifrost to reach external traefik
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: mcp.intranet.winetree94.com
spec:
  description: Allow the mcp.intranet.winetree94.com route to reach bifrost-service and bifrost to reach internal traefik
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
