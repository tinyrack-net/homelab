apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-bifrost
  namespace: bifrost-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: bifrost-system
        app: bifrost
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring-system
              app.kubernetes.io/name: alloy
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: mcp.winetree94.com
spec:
  description: Allow the mcp.winetree94.com route to reach bifrost-service
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: mcp.intranet.winetree94.com
spec:
  description: Allow the mcp.intranet.winetree94.com route to reach bifrost-service
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
