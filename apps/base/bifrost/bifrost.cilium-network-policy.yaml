apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: app-bifrost
  namespace: bifrost-system
specs:
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: bifrost-system
        app: bifrost
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: monitoring-system
              app.kubernetes.io/name: alloy
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
    egress:
      # Config and logs stores
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: bifrost-system
              cnpg.io/cluster: bifrost-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      # Outbound to internal & external Traefik pods directly
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-external-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
      # Egress to LAN LoadBalancer IPs
      - toCIDRSet:
          - cidrGroupRef: traefik-external
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      # Egress to Vivident intranet
      - toCIDRSet:
          - cidrGroupRef: vivident-intranet
        toPorts:
          - ports:
              - port: "443"
                protocol: TCP
      # Egress to CLIProxyAPI
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cliproxyapi-system
              app: cliproxyapi
        toPorts:
          - ports:
              - port: "8317"
                protocol: TCP
      # Egress to the gcloud MCP gateways (gcp_personal, gcp_vivident)
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: gcp-mcp-system
              app: gcp-mcp
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
      # Egress to the email MCP server (email)
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: email-mcp-system
              app: email-mcp
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
      # Egress to homelab LAN (e.g. Qwen server on port 8080)
      - toCIDRSet:
          - cidrGroupRef: lan
        toPorts:
          - ports:
              - port: "8080"
                protocol: TCP
  - endpointSelector:
      matchLabels:
        io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
        k8s:io.kubernetes.pod.namespace: bifrost-system
        cnpg.io/cluster: bifrost-database-cluster
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: bifrost-system
              app: bifrost
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
              - port: "9187"
                protocol: TCP
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: bifrost-system
              cnpg.io/cluster: bifrost-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
              - port: "8000"
                protocol: TCP
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: bifrost-system
              cnpg.io/cluster: bifrost-database-cluster
        toPorts:
          - ports:
              - port: "5432"
                protocol: TCP
              - port: "8000"
                protocol: TCP
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: cnpg-system
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
              - port: "9187"
                protocol: TCP
      # Barman object storage backups go through internal Traefik (Garage S3).
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: traefik-system
              app.kubernetes.io/name: traefik
        toPorts:
          - ports:
              - port: "8443"
                protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: llm.winetree94.com
spec:
  description: Allow the llm.winetree94.com route to reach bifrost-service and bifrost to reach external traefik
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-bifrost
  namespace: traefik-system
  labels:
    networking.tinyrack.net/owner: bifrost
  annotations:
    networking.tinyrack.net/hosts: llm.intranet.winetree94.com,storage.intranet.winetree94.com
spec:
  description: Allow the llm.intranet.winetree94.com route to reach bifrost-service, bifrost to reach internal traefik, and bifrost database backups to reach Garage S3
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            app: bifrost
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bifrost-system
            cnpg.io/cluster: bifrost-database-cluster
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    - toServices:
        - k8sService:
            namespace: bifrost-system
            serviceName: bifrost-service
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
