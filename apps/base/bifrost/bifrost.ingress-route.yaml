# Public: external AI & MCP Gateway endpoints.
# /mcp, /mcp/<slug>, /v1/* (OpenAI-compatible inference) and /health.
# Admin UI, /api/*, metrics, and settings are blocked from public internet.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bifrost-external
  namespace: bifrost-system
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
    - cloudflare
  routes:
    - match: Host(`mcp.winetree94.com`) && (PathPrefix(`/mcp`) || PathPrefix(`/v1`) || Path(`/health`))
      kind: Rule
      services:
        - name: bifrost-service
          port: 8080
  tls:
    secretName: letsencrypt-cert
---
# Internal: complete administrative Web UI & all APIs for LAN/VPN clients.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bifrost-internal
  namespace: bifrost-system
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mcp.intranet.winetree94.com`)
      kind: Rule
      services:
        - name: bifrost-service
          port: 8080
  tls:
    secretName: letsencrypt-cert
