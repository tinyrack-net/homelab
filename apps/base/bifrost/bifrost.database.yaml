apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bifrost-database-backup-store
  namespace: bifrost-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/bifrost/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bifrost-database-cluster
  namespace: bifrost-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-bookworm@sha256:ff50547e391c0df0ff64726962e816effcfd85b4ea42040a70cc502e8ff45d49
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bifrost-database-backup-store
        serverName: bifrost-database-cluster
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 20Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  enableSuperuserAccess: true
  superuserSecret:
    name: bifrost-database-superuser-secret
  externalClusters:
    - name: bifrost-database-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bifrost-database-backup-store
          serverName: bifrost-database-cluster
  bootstrap:
    # Recreate the cluster from the Barman S3 base backup on a full rebuild.
    # The UTF8 `bifrost` database and its owner are restored with the backup.
    recovery:
      source: bifrost-database-recovery-source
      database: bifrost
      owner: bifrost
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bifrost-backup
  namespace: bifrost-system
spec:
  schedule: "0 0 */4 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bifrost-database-cluster
