apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: bifrost-database-backup-store
  namespace: bifrost-system
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://tinyrack-homelab/apps/bifrost/database-18
    endpointURL: https://storage.intranet.winetree94.com
    s3Credentials:
      region:
        name: tinyrack-homelab-s3-secret
        key: AWS_REGION
      accessKeyId:
        name: tinyrack-homelab-s3-secret
        key: AWS_ACCESS_KEY_ID
      secretAccessKey:
        name: tinyrack-homelab-s3-secret
        key: AWS_SECRET_ACCESS_KEY
    data:
      compression: gzip
      # Split the base backup into 2GB archives. Garage needs ~5s/GB to finish
      # CompleteMultipartUpload; past ~11GB that exceeded botocore's 60s read
      # timeout, the automatic retry hit NoSuchUpload, and every backup was
      # marked failed even though data.tar.gz had been stored.
      # The split alone was not enough: two 2026-11-17 backups still failed
      # with NoSuchUpload while Garage was busy. Give CompleteMultipartUpload
      # 5 minutes before botocore retries it.
      additionalCommandArgs:
        - "--max-archive-size=2GB"
        - "--read-timeout=300"
    wal:
      compression: gzip
      maxParallel: 8
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bifrost-database-cluster
  namespace: bifrost-system
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:6669f2fdbc344beb60d307e7aa0a343c510183ac49fd13db8d161d294ed5e141
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: bifrost-database-backup-store
        serverName: bifrost-database-cluster
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 40Gi
      storageClassName: longhorn-strict-local
      volumeMode: Filesystem
  enableSuperuserAccess: true
  superuserSecret:
    name: bifrost-database-superuser-secret
  externalClusters:
    - name: bifrost-database-recovery-source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: bifrost-database-backup-store
          serverName: bifrost-database-cluster
  bootstrap:
    # Recreate the cluster from the Barman S3 base backup on a full rebuild.
    # The UTF8 `bifrost` database and its owner are restored with the backup.
    # Keep `secret`: without it CNPG may generate bifrost-database-cluster-app
    # and reset the owner password, locking Bifrost out of the database.
    recovery:
      source: bifrost-database-recovery-source
      database: bifrost
      owner: bifrost
      secret:
        name: bifrost-database-user-secret
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bifrost-backup
  namespace: bifrost-system
spec:
  schedule: "0 0 12 * * *"  # daily 21:00 KST, before borgmatic (WAL keeps PITR)
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: bifrost-database-cluster
