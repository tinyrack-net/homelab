apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
  namespace: bifrost-system
data:
  config.json: |
    {
      "$schema": "https://www.getbifrost.ai/schema",
      "auth_config": {
        "admin_username": "admin",
        "admin_password": "env.BIFROST_ADMIN_PASSWORD",
        "is_enabled": true
      },
      "client": {
        "allowed_origins": ["*"],
        "enable_logging": true,
        "enforce_auth_on_inference": true,
        "skills_external_client_url": "https://llm.intranet.winetree94.com"
      },
      "config_store": {
        "type": "postgres",
        "enabled": true,
        "config": {
          "host": "bifrost-database-cluster-rw.bifrost-system.svc.cluster.local",
          "port": "5432",
          "user": "bifrost",
          "password": "env.BIFROST_POSTGRES_PASSWORD",
          "db_name": "bifrost",
          "ssl_mode": "require",
          "max_idle_conns": 5,
          "max_open_conns": 20
        }
      },
      "logs_store": {
        "type": "postgres",
        "enabled": true,
        "config": {
          "host": "bifrost-database-cluster-rw.bifrost-system.svc.cluster.local",
          "port": "5432",
          "user": "bifrost",
          "password": "env.BIFROST_POSTGRES_PASSWORD",
          "db_name": "bifrost",
          "ssl_mode": "require",
          "max_idle_conns": 5,
          "max_open_conns": 20
        }
      },
      "plugins": [
        {
          "name": "governance",
          "enabled": true,
          "config": {
            "is_enterprise": false,
            "is_vk_mandatory": false
          }
        }
      ]
    }
