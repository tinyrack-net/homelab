apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bifrost
  namespace: bifrost-system
spec:
  serviceName: bifrost-service
  replicas: 1
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Sync config.json from the ConfigMap on every start. Runtime UI/API
        # edits live in the PostgreSQL config store (split source-of-truth mode).
        - name: init-config
          image: busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |
              cp /bootstrap/config.json /app/data/config.json
          volumeMounts:
            - name: bootstrap-config
              mountPath: /bootstrap
              readOnly: true
            - name: data
              mountPath: /app/data
        # Official Node.js Alpine image provides node and npx
        - name: init-tools-node
          image: docker.io/library/node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
          command:
            - sh
            - -c
            - |
              mkdir -p /tools/bin /tools/lib/node_modules
              cp /usr/local/bin/node /tools/bin/
              cp -r /usr/local/lib/node_modules/npm /tools/lib/node_modules/
              ln -sf ../lib/node_modules/npm/bin/npm-cli.js /tools/bin/npm
              ln -sf ../lib/node_modules/npm/bin/npx-cli.js /tools/bin/npx
              cp /usr/lib/libstdc++.so.6 /tools/lib/
              cp /usr/lib/libgcc_s.so.1 /tools/lib/
          volumeMounts:
            - name: tools
              mountPath: /tools
        # Official Astral uv Alpine image provides uv and uvx
        - name: init-tools-uv
          image: ghcr.io/astral-sh/uv:alpine@sha256:788c243c482a0b16ef0e05c6e5bf7e4c2ba7f2e7ec04f05eb758a28607cfb652
          command:
            - sh
            - -c
            - |
              cp /usr/local/bin/uv /tools/bin/
              cp /usr/local/bin/uvx /tools/bin/
          volumeMounts:
            - name: tools
              mountPath: /tools
      containers:
        - name: bifrost
          image: docker.io/maximhq/bifrost:v2.5.1@sha256:5ec9873acaf1687556b6e4dd854b92b539d9debf87a5a683b66338648b84d3c8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BIFROST_HOST
              value: "0.0.0.0"
            - name: BIFROST_PORT
              value: "8080"
            - name: APP_DIR
              value: "/app/data"
            - name: PATH
              value: "/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            - name: LD_LIBRARY_PATH
              value: "/tools/lib"
            # Caches and execution dir on persistent volume
            - name: HOME
              value: "/app/data/home"
            - name: UV_CACHE_DIR
              value: "/app/data/home/.cache/uv"
            - name: npm_config_cache
              value: "/app/data/home/.npm"
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: encryption-key
            - name: BIFROST_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-database-user-secret
                  key: password
            - name: BIFROST_ADMIN_USERNAME
              value: "admin"
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bifrost-secrets
                  key: admin-password
          # Stdio MCP clients (registered in the admin UI) inherit this env and
          # list variable names only in their `envs`, so no credential is
          # stored in the config store (e.g. PERSONAL_DB_PASSWORD for
          # dbhub_personal).
          envFrom:
            - secretRef:
                name: bifrost-mcp-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tools
              mountPath: /tools
              readOnly: true
            # DBHub configs of the stdio MCP clients (mcp-dbhub/).
            - name: mcp-dbhub
              mountPath: /etc/bifrost-mcp/dbhub
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: bootstrap-config
          configMap:
            name: bifrost-config
        - name: data
          persistentVolumeClaim:
            claimName: bifrost-data
        - name: tools
          emptyDir: {}
        - name: mcp-dbhub
          configMap:
            name: bifrost-mcp-dbhub
