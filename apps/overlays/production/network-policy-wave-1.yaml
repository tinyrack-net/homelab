apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policy-wave-1
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/network-policy-wave-1
  # Namespace activation resources must never be pruned; pruning could delete
  # an application namespace. Disable the label before removing this wave.
  prune: false
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: network-security
    - name: beszel
    - name: proxer-deployment
