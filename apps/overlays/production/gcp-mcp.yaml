apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gcp-mcp-production
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./apps/base/gcp-mcp
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
  dependsOn:
    - name: sealed-secrets
