apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policy-wave-3
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/network-policy-wave-3
  # Namespace activation resources must never be pruned.
  prune: false
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: network-policy-wave-2
    - name: openwebui-deployment
    - name: litellm-deployment
    - name: guacamole-deployment
    - name: n8n-deployment
    - name: infisical-deployment
    - name: issuary-production
