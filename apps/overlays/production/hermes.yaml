apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes-deployment
  namespace: flux-system
spec:
  interval: 30m0s
  path: ./apps/base/hermes
  prune: true
  retryInterval: 2m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The -desktop image is ~1.3GB compressed.
  timeout: 15m0s
  wait: true
  dependsOn:
    - name: sealed-secrets
    - name: reflector
