apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dbhub
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/dbhub
  prune: true
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: sealed-secrets
    - name: reflector
    - name: personal-data
