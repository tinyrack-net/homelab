apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: personal-data
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/personal-data
  prune: true
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: cloudnative-pg
    - name: sealed-secrets
