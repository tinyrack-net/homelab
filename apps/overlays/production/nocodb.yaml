apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nocodb-database
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/nocodb/database
  prune: true
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: cloudnative-pg
    - name: sealed-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nocodb-storage
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/nocodb/storage
  prune: true
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: nocodb-database
    - name: juicefs-csi-driver
    - name: sealed-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nocodb-deployment
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/nocodb/app
  prune: true
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: nocodb-database
    - name: nocodb-storage
    - name: juicefs-csi-driver
    - name: reflector
