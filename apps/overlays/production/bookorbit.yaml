apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit-database
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/bookorbit/database
  prune: true
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: cloudnative-pg
    - name: sealed-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit-storage
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/bookorbit/storage
  prune: true
  timeout: 10m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: bookorbit-database
    - name: juicefs-csi-driver
    - name: longhorn
    - name: sealed-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit-deployment
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/bookorbit/app
  prune: true
  timeout: 15m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: load-repositories
    - name: bookorbit-database
    - name: bookorbit-storage
    - name: juicefs-csi-driver
    - name: reflector
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit-metadata
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/bookorbit/metadata
  prune: true
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: bookorbit-database
    - name: sealed-secrets
