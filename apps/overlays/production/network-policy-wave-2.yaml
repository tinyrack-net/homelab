apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policy-wave-2
  namespace: flux-system
spec:
  interval: 15m
  path: ./apps/base/network-policy-wave-2
  # Namespace activation resources must never be pruned.
  prune: false
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: network-policy-wave-1
    - name: searxng
    - name: karakeep-deployment
