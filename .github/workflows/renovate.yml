name: renovate

# Renovate is the scheduled dependency updater for this repository.
#
# Scheduling ownership: the *when* lives in `renovate.json5`
# (`schedule: ['before 6am on saturday']`, Asia/Seoul). This workflow only
# provides the trigger and runs daily, so one of those daily runs always lands
# inside that window. Do not add a second schedule to `renovate.json5` -- keeping
# a single owner is what makes runs predictable.
#
# Required repository secret:
#   RENOVATE_TOKEN -- a classic PAT with `repo` and `workflow` scopes, or a
#   fine-grained token with Contents:write, Pull requests:write, Issues:write.
#   A GitHub App (RENOVATE_APP_ID + RENOVATE_APP_PRIVATE_KEY) also works; swap
#   the token env below if you switch. Without it this job fails fast.

on:
  schedule:
    # 18:00 UTC daily == 03:00 Asia/Seoul, which is inside the
    # "before 6am on saturday" window on Friday UTC / Saturday KST.
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        type: choice
        default: info
        options: [info, debug]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.11
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Keep the dependency dashboard issue in sync with what Renovate sees.
          RENOVATE_ONBOARDING: 'false'
