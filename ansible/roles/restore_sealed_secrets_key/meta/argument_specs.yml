---
argument_specs:
  main:
    short_description: Restore every Sealed Secrets controller key
    options:
      restore_sealed_secrets_key_namespace:
        type: str
        required: true
      restore_sealed_secrets_key_ready_timeout:
        type: str
        required: true
      restore_sealed_secrets_key_tls_crt_path:
        type: str
        required: true
      restore_sealed_secrets_key_keys:
        type: list
        elements: dict
        required: true
        options:
          name:
            type: str
            required: true
          tls_crt:
            type: str
            required: true
          tls_key:
            type: str
            required: true
