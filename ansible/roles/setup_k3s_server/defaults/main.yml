---
setup_k3s_server_version: v1.37.1+k3s1
setup_k3s_server_cluster_cidr: 10.61.0.0/16
setup_k3s_server_service_cidr: 10.62.0.0/16
setup_k3s_server_metrics_bind_address: "{{ ansible_facts['default_ipv4']['address'] }}"
setup_k3s_server_disabled_components:
  - traefik
  - servicelb
setup_k3s_server_flannel_backend: none
setup_k3s_server_disable_network_policy: true
setup_k3s_server_disable_kube_proxy: true
# k3s defaults to 110 pods per node. The single-node cluster already runs
# ~110 non-terminated pods, so the scheduler rejects every new pod. Raise the
# kubelet limit; keep it below the ~253 addresses Cilium hands out per node
# (cluster-pool with cluster-pool-ipv4-mask-size: 24).
setup_k3s_server_max_pods: 200
setup_k3s_server_inotify_settings:
  fs.inotify.max_queued_events: 32768
  fs.inotify.max_user_instances: 8192
  fs.inotify.max_user_watches: 1048576
setup_k3s_server_inotify_sysctl_path: /etc/sysctl.d/90-k3s-inotify.conf
# cloudflared runs its Cloudflare Tunnel over QUIC. quic-go asks for 7 MiB
# UDP socket buffers and falls back to 416 KiB under the 208 KiB kernel
# default, which drops packets on bursty uploads. Raise only the caps;
# sockets that do not ask for larger buffers keep the default size.
setup_k3s_server_network_buffer_settings:
  net.core.rmem_max: 7500000
  net.core.wmem_max: 7500000
setup_k3s_server_network_buffer_sysctl_path: /etc/sysctl.d/90-k3s-network-buffers.conf
# Ubuntu's stock `chrome` AppArmor profile grants unprivileged user
# namespaces and nothing else. Browser pods request it to enable the Chromium
# sandbox, because the node restricts userns to profiled programs.
setup_k3s_server_apparmor_profiles_path: /sys/kernel/security/apparmor/profiles
setup_k3s_server_chrome_apparmor_profile_path: /etc/apparmor.d/chrome
setup_k3s_server_packages:
  - ca-certificates
  - cryptsetup
  - curl
  - jq
  - nfs-common
  - open-iscsi
setup_k3s_server_disabled_multipath_units:
  - multipathd.socket
  - multipathd.service
setup_k3s_server_install_script_url: https://get.k3s.io
setup_k3s_server_install_script_path: /usr/local/src/k3s-install.sh
setup_k3s_server_config_path: /etc/rancher/k3s/config.yaml
setup_k3s_server_containerd_config_directory: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
setup_k3s_server_containerd_cni_config_path: "{{ setup_k3s_server_containerd_config_directory }}/10-cni.toml"
setup_k3s_server_cni_bin_directory: /var/lib/rancher/k3s/data/cni
setup_k3s_server_cni_config_directory: /var/lib/rancher/k3s/agent/etc/cni/net.d
