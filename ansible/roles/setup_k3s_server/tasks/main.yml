---
- name: Run preflight checks
  ansible.builtin.import_tasks: preflight.yml

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: Inspect the K3s configuration directory
  ansible.builtin.stat:
    path: "{{ setup_k3s_server_config_path | dirname }}"
  register: setup_k3s_server_config_directory

- name: Inspect the K3s installer directory
  ansible.builtin.stat:
    path: "{{ setup_k3s_server_install_script_path | dirname }}"
  register: setup_k3s_server_installer_directory

- name: Configure K3s inotify limits
  ansible.builtin.template:
    src: inotify.conf.j2
    dest: "{{ setup_k3s_server_inotify_sysctl_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Apply K3s inotify limits

- name: Install K3s host packages
  ansible.builtin.apt:
    name: "{{ setup_k3s_server_packages }}"
    state: present
    update_cache: true

- name: Enable the iSCSI socket
  ansible.builtin.systemd_service:
    name: iscsid.socket
    enabled: true
    state: started
  when: not ansible_check_mode or "open-iscsi" in ansible_facts.packages

- name: Start the iSCSI daemon
  ansible.builtin.systemd_service:
    name: iscsid.service
    state: started
  when: not ansible_check_mode or "open-iscsi" in ansible_facts.packages

- name: Create the K3s configuration directory
  ansible.builtin.file:
    path: "{{ setup_k3s_server_config_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the K3s containerd configuration drop-in directory
  ansible.builtin.file:
    path: "{{ setup_k3s_server_containerd_config_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure the K3s containerd CNI paths
  ansible.builtin.template:
    src: containerd-cni.toml.j2
    dest: "{{ setup_k3s_server_containerd_cni_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart K3s

- name: Create the K3s installer directory
  ansible.builtin.file:
    path: "{{ setup_k3s_server_install_script_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure K3s
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ setup_k3s_server_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart K3s
  when: not ansible_check_mode or setup_k3s_server_config_directory.stat.exists

- name: Download the K3s installer
  ansible.builtin.get_url:
    url: "{{ setup_k3s_server_install_script_url }}"
    dest: "{{ setup_k3s_server_install_script_path }}"
    owner: root
    group: root
    mode: "0755"
  when: not ansible_check_mode or setup_k3s_server_installer_directory.stat.exists

- name: Read the installed K3s version
  ansible.builtin.command:
    cmd: /usr/local/bin/k3s --version
  register: setup_k3s_server_installed_version
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install the pinned K3s version
  ansible.builtin.command:
    cmd: "{{ setup_k3s_server_install_script_path }}"
  environment:
    INSTALL_K3S_EXEC: server
    INSTALL_K3S_VERSION: "{{ setup_k3s_server_version }}"
  when: setup_k3s_server_version not in setup_k3s_server_installed_version.stdout
  changed_when: true

- name: Enable and start K3s
  ansible.builtin.systemd_service:
    name: k3s.service
    enabled: true
    state: started
  when: not ansible_check_mode or setup_k3s_server_installed_version.rc == 0
