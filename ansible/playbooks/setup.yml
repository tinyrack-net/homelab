---
- name: Configure K3s server hosts
  hosts: k3s_servers
  gather_facts: true
  become: false

  pre_tasks:
    - name: Require the homelab become password
      ansible.builtin.assert:
        that:
          - ansible_become_password is defined
          - ansible_become_password != "CHANGE_ME"
        fail_msg: Run `make vault-edit` and replace the become password placeholder before applying.

    - name: Validate the Sealed Secrets recovery key before changing the host
      ansible.builtin.include_role:
        name: restore_sealed_secrets_key
        tasks_from: preflight

  roles:
    - role: setup_qemu_guest_agent
      become: true
    - role: setup_k3s_server
      become: true
    - role: restore_sealed_secrets_key
      become: true
