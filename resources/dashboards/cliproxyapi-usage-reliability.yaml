apiVersion: dashboard.grafana.app/v1beta1
kind: Dashboard
metadata:
  name: cliproxyapi-usage-reliability
  annotations:
    grafana.app/folder: efxqvg37f12wwf
spec:
  title: "CLIProxyAPI · Usage & Reliability"
  tags: [cliproxyapi, llm, usage, homelab]
  timezone: browser
  schemaVersion: 39
  refresh: 30s
  time:
    from: now-24h
    to: now
  templating:
    list:
      - name: provider
        label: Provider
        type: query
        datasource:
          type: prometheus
          uid: VictoriaMetrics
        query:
          query: label_values(cliproxyapi_usage_requests_total, provider)
          refId: provider
        includeAll: true
        allValue: .*
        multi: true
        current:
          text: All
          value: $__all
      - name: model
        label: Model
        type: query
        datasource:
          type: prometheus
          uid: VictoriaMetrics
        query:
          query: label_values(cliproxyapi_usage_requests_total{provider=~"$provider"}, model)
          refId: model
        includeAll: true
        allValue: .*
        multi: true
        current:
          text: All
          value: $__all
      - name: alias
        label: Alias
        type: query
        datasource:
          type: prometheus
          uid: VictoriaMetrics
        query:
          query: label_values(cliproxyapi_usage_requests_total{provider=~"$provider",model=~"$model"}, alias)
          refId: alias
        includeAll: true
        allValue: .*
        multi: true
        current:
          text: All
          value: $__all
  panels:
    - id: 1
      title: Request Rate
      type: stat
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 5, w: 6, x: 0, y: 0}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: sum(rate(cliproxyapi_usage_requests_total{provider=~"$provider",model=~"$model",alias=~"$alias"}[$__rate_interval]))
          legendFormat: Requests
      fieldConfig:
        defaults:
          unit: reqps
          decimals: 2
        overrides: []
      options:
        colorMode: value
        graphMode: area
        justifyMode: auto
        textMode: auto
    - id: 2
      title: Error Ratio
      type: stat
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 5, w: 6, x: 6, y: 0}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: sum(rate(cliproxyapi_usage_requests_total{provider=~"$provider",model=~"$model",alias=~"$alias",failed="true"}[$__rate_interval])) / clamp_min(sum(rate(cliproxyapi_usage_requests_total{provider=~"$provider",model=~"$model",alias=~"$alias"}[$__rate_interval])), 1e-9)
          legendFormat: Errors
      fieldConfig:
        defaults:
          unit: percentunit
          decimals: 2
          thresholds:
            mode: absolute
            steps:
              - color: green
                value: null
              - color: yellow
                value: 0.02
              - color: red
                value: 0.05
        overrides: []
      options:
        colorMode: background
        graphMode: none
        justifyMode: auto
        textMode: auto
    - id: 3
      title: Tokens in Range
      type: stat
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 5, w: 6, x: 12, y: 0}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: sum(increase(cliproxyapi_usage_tokens_total{provider=~"$provider",model=~"$model",alias=~"$alias",direction="total"}[$__range]))
          legendFormat: Tokens
      fieldConfig:
        defaults:
          unit: short
          decimals: 0
        overrides: []
      options:
        colorMode: value
        graphMode: area
        justifyMode: auto
        textMode: auto
    - id: 4
      title: Exporter Freshness
      type: stat
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 5, w: 6, x: 18, y: 0}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: time() - max(cliproxyapi_usage_collector_last_success_timestamp_seconds)
          legendFormat: Seconds since success
      fieldConfig:
        defaults:
          unit: s
          decimals: 0
          thresholds:
            mode: absolute
            steps:
              - color: green
                value: null
              - color: yellow
                value: 30
              - color: red
                value: 120
        overrides: []
      options:
        colorMode: background
        graphMode: none
        justifyMode: auto
        textMode: auto
    - id: 5
      title: Tokens by Direction
      type: timeseries
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 9, w: 12, x: 0, y: 5}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: sum by (direction) (rate(cliproxyapi_usage_tokens_total{provider=~"$provider",model=~"$model",alias=~"$alias"}[$__rate_interval])) * 60
          legendFormat: "{{direction}}"
      fieldConfig:
        defaults:
          unit: short
          decimals: 1
          custom:
            drawStyle: line
            lineInterpolation: smooth
            fillOpacity: 12
            showPoints: never
            spanNulls: true
        overrides: []
      options:
        legend:
          displayMode: table
          placement: bottom
          showLegend: true
          calcs: [mean, max]
        tooltip:
          mode: multi
          sort: desc
    - id: 6
      title: Latency and TTFT p95
      type: timeseries
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 9, w: 12, x: 12, y: 5}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: histogram_quantile(0.95, sum by (le) (rate(cliproxyapi_usage_request_latency_seconds_bucket{provider=~"$provider",model=~"$model",alias=~"$alias"}[$__rate_interval])))
          legendFormat: Request p95
        - refId: B
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: histogram_quantile(0.95, sum by (le) (rate(cliproxyapi_usage_ttft_seconds_bucket{provider=~"$provider",model=~"$model",alias=~"$alias"}[$__rate_interval])))
          legendFormat: TTFT p95
      fieldConfig:
        defaults:
          unit: s
          decimals: 2
          custom:
            drawStyle: line
            lineInterpolation: smooth
            fillOpacity: 8
            showPoints: never
            spanNulls: true
        overrides: []
      options:
        legend:
          displayMode: table
          placement: bottom
          showLegend: true
          calcs: [mean, max]
        tooltip:
          mode: multi
          sort: desc
    - id: 7
      title: Top Models by Tokens
      type: table
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 9, w: 12, x: 0, y: 14}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: topk(10, sum by (provider, model, alias) (increase(cliproxyapi_usage_tokens_total{provider=~"$provider",model=~"$model",alias=~"$alias",direction="total"}[$__range])))
          format: table
          instant: true
          legendFormat: "{{provider}} / {{model}} / {{alias}}"
      fieldConfig:
        defaults:
          unit: short
          decimals: 0
        overrides: []
      options:
        showHeader: true
        sortBy:
          - desc: true
            displayName: Value
    - id: 8
      title: Exporter Poll Failures
      type: timeseries
      datasource:
        type: prometheus
        uid: VictoriaMetrics
      gridPos: {h: 9, w: 12, x: 12, y: 14}
      targets:
        - refId: A
          datasource:
            type: prometheus
            uid: VictoriaMetrics
          expr: sum by (result) (rate(cliproxyapi_usage_collector_polls_total{result!="success"}[$__rate_interval]))
          legendFormat: "{{result}}"
      fieldConfig:
        defaults:
          unit: ops
          decimals: 2
          custom:
            drawStyle: line
            lineInterpolation: smooth
            fillOpacity: 16
            showPoints: never
            spanNulls: true
        overrides: []
      options:
        legend:
          displayMode: table
          placement: bottom
          showLegend: true
          calcs: [mean, max]
        tooltip:
          mode: multi
          sort: desc
