apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-davinci-resolve-database
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/davinci-resolve-project-server
  prune: true
  wait: true
  timeout: 60m
  sourceRef:
    kind: GitRepository
    name: flux-system
  patches:
    - target:
        group: postgresql.cnpg.io
        kind: Cluster
        name: davinci-resolve-database-cluster
      patch: |-
        - op: replace
          path: /spec/bootstrap
          value:
            recovery:
              source: davinci-resolve-database-recovery-source
        - op: remove
          path: /spec/managed
    - target:
        group: traefik.io
        kind: IngressRouteTCP
        name: davinci-resolve-ingress-route-tcp
      patch: |-
        apiVersion: traefik.io/v1alpha1
        kind: IngressRouteTCP
        metadata:
          name: davinci-resolve-ingress-route-tcp
          namespace: davinci-resolve-system
        $patch: delete
  dependsOn:
    - name: cloudnative-pg
    - name: configs
