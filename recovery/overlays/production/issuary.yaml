apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-issuary-database
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/issuary
  prune: true
  wait: true
  timeout: 60m
  sourceRef:
    kind: GitRepository
    name: flux-system
  patches:
    - target:
        group: postgresql.cnpg.io
        kind: Cluster
        name: issuary-database-cluster
      patch: |-
        - op: replace
          path: /spec/bootstrap
          value:
            recovery:
              source: issuary-database-recovery-source
    - target:
        group: apps
        kind: Deployment
        name: issuary
      patch: |-
        - op: add
          path: /spec/replicas
          value: 0
    - target:
        group: traefik.io
        kind: IngressRoute
        name: issuary-ingress-route
      patch: |-
        apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: issuary-ingress-route
          namespace: issuary-system
        $patch: delete
  dependsOn:
    - name: cloudnative-pg
    - name: configs
