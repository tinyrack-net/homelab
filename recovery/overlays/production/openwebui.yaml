apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-openwebui-database
  namespace: flux-system
spec:
  interval: 10m
  path: ./apps/base/openwebui
  prune: true
  wait: true
  timeout: 60m
  sourceRef:
    kind: GitRepository
    name: flux-system
  patches:
    - target:
        group: postgresql.cnpg.io
        kind: Cluster
        name: openwebui-database-cluster
      patch: |-
        - op: replace
          path: /spec/bootstrap
          value:
            recovery:
              source: openwebui-database-recovery-source
    - target:
        group: helm.toolkit.fluxcd.io
        kind: HelmRelease
        name: openwebui-helm-release
      patch: |-
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: openwebui-helm-release
          namespace: openwebui-system
        $patch: delete
    - target:
        group: traefik.io
        kind: IngressRoute
        name: openwebui-ingress-route
      patch: |-
        apiVersion: traefik.io/v1alpha1
        kind: IngressRoute
        metadata:
          name: openwebui-ingress-route
          namespace: openwebui-system
        $patch: delete
  dependsOn:
    - name: cloudnative-pg
    - name: configs
