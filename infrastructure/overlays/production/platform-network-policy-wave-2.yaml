apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-network-policy-wave-2
  namespace: flux-system
spec:
  interval: 15m
  path: ./infrastructure/base/platform-network-policy-wave-2
  # Namespace activation resources must never be pruned.
  prune: false
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-network-policy-wave-1
    - name: cloudnative-pg
    - name: ot-redis-operator-deployment
    - name: cert-manager
    - name: kyverno
    - name: tailscale-deployment
