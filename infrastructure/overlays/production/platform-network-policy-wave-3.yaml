apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-network-policy-wave-3
  namespace: flux-system
spec:
  interval: 15m
  path: ./infrastructure/base/platform-network-policy-wave-3
