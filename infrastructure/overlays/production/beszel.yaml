apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: beszel
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  interval: 15m
  path: ./infrastructure/base/beszel
  prune: true
  timeout: 5m
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: sealed-secrets
    - name: reflector
    - name: longhorn
    - name: traefik-external
