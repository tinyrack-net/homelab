  - k3s-upgrade-plan.yaml
  - sealed-secrets.yaml
  - reflector.yaml
  - configs.yaml
  - longhorn.yaml
  - cert-manager.yaml
  - multus.yaml
  - traefik.yaml
  - traefik-external.yaml
  - hubble-ui.yaml
  - cloudnative-pg.yaml
  - backup-cleanup.yaml
  - mariadb-operator.yaml
  - ot-redis-operator.yaml
