apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.0/cnpg-1.30.0.yaml
  - cnpg-backup-reaper.serviceaccount.yaml
  - cnpg-backup-reaper.clusterrole.yaml
  - cnpg-backup-reaper.clusterrolebinding.yaml
  - cnpg-backup-reaper.cronjob.yaml
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.14.0/manifest.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: cnpg-controller-manager
      namespace: cnpg-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: CLUSTERS_ROLLOUT_DELAY
          value: "120"
