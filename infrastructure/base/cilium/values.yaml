cluster:
  name: homelab
  id: 0
k8sServiceHost: 127.0.0.1
k8sServicePort: 6443
kubeProxyReplacement: true
defaultLBServiceIPAM: lbipam
rollOutCiliumPods: true
identityAllocationMode: crd
operator:
  replicas: 1
  prometheus:
    enabled: true
    metricsService: true
    serviceMonitor:
      enabled: true
      jobLabel: app.kubernetes.io/name
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.61.0.0/16
    clusterPoolIPv4MaskSize: 24
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  masquerade: true
egressGateway:
  enabled: false
devices: enp6s18
l2announcements:
  enabled: true
k8sClientRateLimit:
  qps: 10
  burst: 20
cni:
  binPath: /var/lib/rancher/k3s/data/cni
  confPath: /var/lib/rancher/k3s/agent/etc/cni/net.d
  exclusive: false
  uninstall: false
policyEnforcementMode: default
hostFirewall:
  enabled: true
prometheus:
  enabled: true
  metricsService: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
    jobLabel: app.kubernetes.io/name
hubble:
  enabled: true
  relay:
    enabled: true
    service:
      type: ClusterIP
  ui:
    enabled: true
