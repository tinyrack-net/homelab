apiVersion: v1
kind: Service
metadata:
  name: cloudflared-metrics
  namespace: cloudflared-system
  labels:
    app.kubernetes.io/name: cloudflared-metrics
spec:
  selector:
    pod: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: 2000
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflared
  namespace: cloudflared-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: cloudflared
