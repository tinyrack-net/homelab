apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-external-release
  namespace: traefik-external-system
spec:
  chart:
    spec:
      chart: traefik
      version: "41.4.0"
      sourceRef:
        kind: HelmRepository
        name: traefik-repository
        namespace: flux-system
  interval: 5m
  timeout: 5m
  releaseName: traefik-external
  valuesFrom:
    - kind: ConfigMap
      name: traefik-values
      valuesKey: values.yaml
