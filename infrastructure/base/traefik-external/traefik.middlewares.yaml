# Shared protection for the websecure entrypoint (see traefik.values.yaml).
# Limits are per client address and sized well above observed peaks
# (a single browser loading Open WebUI or Nextcloud reached ~150 req/s).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-ratelimit
  namespace: traefik-external-system
spec:
  rateLimit:
    average: 100
    period: 1s
    burst: 600
    sourceCriterion:
      ipStrategy:
        depth: 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-inflight
  namespace: traefik-external-system
spec:
  inFlightReq:
    amount: 200
    sourceCriterion:
      ipStrategy:
        depth: 0
---
# No frame or CSP headers here: Nextcloud embeds Collabora and apps set their own.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: edge-headers
  namespace: traefik-external-system
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: false
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
