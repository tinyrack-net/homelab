# WebDAV uploads can be very large and slow; Traefik's default readTimeout
# limits the total time allowed to read the request body, which caused
# long-running DAV uploads to be interrupted before completion.
additionalArguments:
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
  - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s
providers:
  kubernetesCRD:
    allowExternalNameServices: true
    ingressClass: "traefik-external"
  kubernetesIngress:
    allowExternalNameServices: true
    ingressClass: "traefik-external"
deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        traceparent: keep
    queryParameters:
      defaultMode: drop
tracing:
  serviceName: traefik-external
  sampleRate: 0.1
  resourceAttributes:
    cluster: homelab
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://monitoring-alloy.monitoring-system.svc:4318/v1/traces
ingressClass:
  enabled: true
  isDefaultClass: false
  name: "traefik-external"
ports:
  postgres:
    port: 5432
    exposedPort: 5432
    expose:
      default: true
    protocol: TCP
  cloudflare:
    port: 8444
    exposedPort: 443
    expose:
      default: false
      cloudflare: true
    protocol: TCP
    http:
      tls:
        enabled: true
    forwardedHeaders:
      trustedIPs:
        - 10.61.0.0/24
      insecure: false
      notAppendXForwardedFor: true
service:
  labels:
    networking.tinyrack.net/load-balancer: cilium-l2
  annotations:
    lbipam.cilium.io/ips: "10.132.246.2"
  additionalServices:
    cloudflare:
      type: ClusterIP
