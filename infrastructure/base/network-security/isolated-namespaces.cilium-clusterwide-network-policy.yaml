apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: isolated-namespaces
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
  ingress:
    - fromEntities:
        - host
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Allow public egress while excluding every internal range.
    # CiliumCIDRGroup cannot be referenced from `except`, so these stay literal.
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8 # RFC1918 private (includes the LAN and the VPN ranges)
            - 100.64.0.0/10 # RFC6598 CGNAT (Tailscale)
            - 169.254.0.0/16 # Link-local
            - 172.16.0.0/12 # RFC1918 private
            - 192.168.0.0/16 # RFC1918 private
