providers:
  kubernetesCRD:
    allowExternalNameServices: true
    ingressClass: "traefik"
  kubernetesIngress:
    allowExternalNameServices: true
    ingressClass: "traefik"
additionalArguments:
  - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=0s
  - --entryPoints.websecure.transport.respondingTimeouts.idleTimeout=600s
deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9100"
    prometheus.io/path: /metrics
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        traceparent: keep
    queryParameters:
      defaultMode: drop
tracing:
  serviceName: traefik-internal
  sampleRate: 1.0
  resourceAttributes:
    cluster: homelab
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://monitoring-trace-sampler.monitoring-system.svc:4318/v1/traces
ingressClass:
  enabled: true
  isDefaultClass: true
  name: "traefik"
ports:
  postgres:
    port: 5432
    exposedPort: 5432
    expose:
      default: true
    protocol: TCP
service:
  labels:
    networking.tinyrack.net/load-balancer: cilium-l2
  annotations:
    lbipam.cilium.io/ips: "10.132.246.1"
