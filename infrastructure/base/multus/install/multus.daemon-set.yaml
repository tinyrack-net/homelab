apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
  labels:
    app.kubernetes.io/name: multus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multus
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: multus
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: install-secondary-cni-plugins
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - /bin/sh
            - -ec
            - |
              archive=/tmp/cni-plugins.tgz
              wget -qO "$archive" https://github.com/containernetworking/plugins/releases/download/v1.9.1/cni-plugins-linux-amd64-v1.9.1.tgz
              echo "b98f74a0f8522f0a83867178729c1aa70f2158f90c45a2ca8fa791db1c76b303  $archive" | sha256sum -c -
              tar -xzf "$archive" -C /tmp ./macvlan ./static
              rm -f /host-cni/macvlan /host-cni/static
              cp /tmp/macvlan /tmp/static /host-cni/
              chmod 0755 /host-cni/macvlan /host-cni/static
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host-cni
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0-thick@sha256:2b9671447f3ea4e7e56730843dbf59445b9307246f393b61386b896d56ae51c9
          command:
            - /usr/src/multus-cni/bin/install_multus
            - -d
            - /host-cni
            - -t
            - thick
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host-cni
              mountPropagation: Bidirectional
      containers:
        - name: kube-multus
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0-thick@sha256:2b9671447f3ea4e7e56730843dbf59445b9307246f393b61386b896d56ae51c9
          command:
            - /usr/src/multus-cni/bin/multus-daemon
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 50Mi
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: MULTUS_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: k3s-data
              mountPath: /var/lib/rancher/k3s/data
              readOnly: true
            - name: cni-config
              mountPath: /host/var/lib/rancher/k3s/agent/etc/cni/net.d
            - name: host-run
              mountPath: /host/run
            - name: multus-state
              mountPath: /var/lib/cni/multus
            - name: host-kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: HostToContainer
            - name: network-status
              mountPath: /run/k8s.cni.cncf.io
            - name: network-namespaces
              mountPath: /run/netns
              mountPropagation: HostToContainer
            - name: daemon-config
              mountPath: /etc/cni/net.d/multus.d
              readOnly: true
            - name: host-root
              mountPath: /hostroot
              mountPropagation: HostToContainer
            - name: multus-config
              mountPath: /etc/cni/multus/net.d
      volumes:
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
        - name: cni-config
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
        - name: cni-bin
          hostPath:
            path: /var/lib/rancher/k3s/data/cni
        - name: host-run
          hostPath:
            path: /run
        - name: multus-state
          hostPath:
            path: /var/lib/cni/multus
            type: DirectoryOrCreate
        - name: host-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: network-status
          hostPath:
            path: /run/k8s.cni.cncf.io
            type: DirectoryOrCreate
        - name: network-namespaces
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: daemon-config
          configMap:
            name: multus-daemon-config
            items:
              - key: daemon-config.json
                path: daemon-config.json
        - name: host-root
          hostPath:
            path: /
        - name: multus-config
          hostPath:
            path: /etc/cni/multus/net.d
            type: DirectoryOrCreate
