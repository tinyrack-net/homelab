apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
  labels:
    app.kubernetes.io/name: multus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: multus
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multus
    spec:
      hostNetwork: true
      hostPID: true
      serviceAccountName: multus
      terminationGracePeriodSeconds: 10
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      initContainers:
        - name: install-k3s-cni-links
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -ec
            - |
              test -L /host-cni/cni
              ln -sfn cni /host-cni/macvlan
              ln -sfn cni /host-cni/static
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host-cni
        - name: install-multus-binary
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0-thick
          command:
            - /usr/src/multus-cni/bin/install_multus
            - -d
            - /host-cni
            - -t
            - thick
          securityContext:
            privileged: true
          volumeMounts:
            - name: cni-bin
              mountPath: /host-cni
              mountPropagation: Bidirectional
      containers:
        - name: kube-multus
          image: ghcr.io/k8snetworkplumbingwg/multus-cni:v4.3.0-thick
          command:
            - /usr/src/multus-cni/bin/multus-daemon
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 50Mi
            limits:
              cpu: 100m
              memory: 50Mi
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: MULTUS_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: cni-config
              mountPath: /host/var/lib/rancher/k3s/agent/etc/cni/net.d
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: k3s-data
              mountPath: /var/lib/rancher/k3s/data
              readOnly: true
            - name: host-run
              mountPath: /host/run
            - name: multus-state
              mountPath: /var/lib/cni/multus
            - name: host-kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: HostToContainer
            - name: network-status
              mountPath: /run/k8s.cni.cncf.io
            - name: network-namespaces
              mountPath: /run/netns
              mountPropagation: HostToContainer
            - name: daemon-config
              mountPath: /etc/cni/net.d/multus.d
              readOnly: true
            - name: host-root
              mountPath: /hostroot
              mountPropagation: HostToContainer
            - name: multus-config
              mountPath: /etc/cni/multus/net.d
      volumes:
        - name: cni-config
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
        - name: cni-bin
          hostPath:
            path: /var/lib/rancher/k3s/data/cni
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
        - name: host-run
          hostPath:
            path: /run
        - name: multus-state
          hostPath:
            path: /var/lib/cni/multus
            type: DirectoryOrCreate
        - name: host-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: network-status
          hostPath:
            path: /run/k8s.cni.cncf.io
            type: DirectoryOrCreate
        - name: network-namespaces
          hostPath:
            path: /run/netns
            type: DirectoryOrCreate
        - name: daemon-config
          configMap:
            name: multus-daemon-config
            items:
              - key: daemon-config.json
                path: daemon-config.json
        - name: host-root
          hostPath:
            path: /
        - name: multus-config
          hostPath:
            path: /etc/cni/multus/net.d
            type: DirectoryOrCreate
