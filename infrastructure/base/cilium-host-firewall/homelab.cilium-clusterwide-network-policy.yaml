apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: homelab-host-firewall
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  ingress:
    - fromCIDR:
        - 10.132.244.0/22
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
            - port: "68"
              protocol: UDP
            - port: "6443"
              protocol: TCP
    - fromCIDR:
        - 10.132.244.0/22
      icmps:
        - fields:
            - family: IPv4
              type: 8
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP
            - port: "6443"
              protocol: TCP
            - port: "8472"
              protocol: UDP
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "21115"
              protocol: TCP
            - port: "21116"
              protocol: TCP
            - port: "21116"
              protocol: UDP
            - port: "21117"
              protocol: TCP
            - port: "21118"
              protocol: TCP
            - port: "21119"
              protocol: TCP
            - port: "51820"
              protocol: UDP
    - fromCIDR:
        - 10.132.244.0/22
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
