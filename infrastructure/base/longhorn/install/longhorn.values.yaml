persistence:
  defaultClass: true
  defaultClassReplicaCount: 1
longhornUI:
  replicas: 1
# New in chart 1.13.0. Default is 3 (1 leader + 2 warm standbys); on a
# single-node cluster the standbys land on the same node and only add memory
# and API load, so keep a single replica.
longhornGlobalManager:
  replicas: 1
defaultSettings:
  defaultReplicaCount: 1
  # Longhorn's default of 100% caps *scheduled* (nominal) replica size at
  # (storageMaximum - storageReserved) = ~425Gi with the 15% default-disk
  # reservation below. The single node is physically half empty (~245Gi of
  # ~500Gi used) but was already carrying ~412Gi of nominal scheduling, so new
  # PVC replicas were rejected as "insufficient storage". 150% keeps the
  # reservation (real free space guard) while allowing thin volumes to commit.
  storageOverProvisioningPercentage: 150
  concurrentAutomaticEngineUpgradePerNodeLimit: 1
  storageReservedPercentageForDefaultDisk: 15
  guaranteedInstanceManagerCPU: 5
defaultBackupStore:
  backupTarget: s3://tinyrack-homelab@home/clusters/tinyrack-homelab/longhorn
  backupTargetCredentialSecret: tinyrack-homelab-s3-secret
ingress:
  enabled: true
  host: longhorn.intranet.winetree94.com
  tls: true
  tlsSecret: letsencrypt-cert
