apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: juicefs-csi-driver
spec:
  interval: 5m
  timeout: 10m
  releaseName: juicefs-csi-driver
  targetNamespace: kube-system
  storageNamespace: kube-system
  chart:
    spec:
      chart: juicefs-csi-driver
      version: 0.32.5
      sourceRef:
        kind: HelmRepository
        name: juicefs-repository
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: juicefs-values
      valuesKey: values.yaml
