apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - monitoring.namespace.yaml
  - monitoring.stack.helm-release.yaml
  - monitoring.k8s-monitoring.helm-release.yaml
  - monitoring.trace-sampler.alloy.yaml
  - monitoring.service-monitors.yaml
  - monitoring.ingress-route.yaml
  - monitoring.cilium-network-policy.yaml
  - monitoring.scrape.cilium-network-policy.yaml
  - monitoring.traefik.cilium-network-policy.yaml
  - monitoring.grafana-oidc.cilium-network-policy.yaml
  - monitoring.grafana-database.cilium-network-policy.yaml
  - monitoring.grafana.secret.yaml
  - monitoring.grafana-env.secret.yaml
  - monitoring.grafana-database.yaml
  - monitoring.grafana-database-user.secret.yaml
  - monitoring.telemetry.secret.yaml
  - monitoring.issuary.secret.yaml
configMapGenerator:
  - name: monitoring-stack-values
    files:
      - values.yaml=monitoring.stack.values.yaml
    options:
      disableNameSuffixHash: true
      labels:
        reconcile.fluxcd.io/watch: Enabled
    namespace: monitoring-system
