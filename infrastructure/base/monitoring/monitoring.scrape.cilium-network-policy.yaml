apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-monitoring-scrape
  namespace: monitoring-system
  labels:
    networking.tinyrack.net/owner: monitoring
spec:
  description: Allow Alloy to scrape isolated platform metrics endpoints
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/part-of: cilium
      toPorts:
        - ports:
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            app.kubernetes.io/part-of: flux
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager-system
            app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "2381"
              protocol: TCP
            - port: "9100"
              protocol: TCP
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "10250"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "10259"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudflared-system
            pod: cloudflared
      toPorts:
        - ports:
            # cloudflared tunnel metrics.
            - port: "2000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cliproxyapi-system
            app: cliproxyapi
      toPorts:
        - ports:
            - port: "9101"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: nextcloud-system
            app.kubernetes.io/name: nextcloud
      toPorts:
        - ports:
            # Nextcloud /metrics (openmetrics) on the app service.
            - port: "80"
              protocol: TCP
            # nextcloud-exporter.
            - port: "9205"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich-system
            app.kubernetes.io/name: server
      toPorts:
        - ports:
            # immich-api /metrics.
            - port: "8081"
              protocol: TCP
            # immich microservices /metrics.
            - port: "8082"
              protocol: TCP
