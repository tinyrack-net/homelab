apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-monitoring
  namespace: traefik-external-system
  labels:
    networking.tinyrack.net/owner: monitoring
  annotations:
    networking.tinyrack.net/hosts: monitor.winetree94.com,telemetry.winetree94.com
spec:
  description: Allow Grafana and telemetry ingestion routes
  endpointSelector:
    matchLabels:
      io.cilium.k8s.namespace.labels.networking.tinyrack.net/isolation: enabled
      app.kubernetes.io/name: traefik
  egress:
    - toServices:
        - k8sService:
            namespace: monitoring-system
            serviceName: monitoring-grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    - toServices:
        - k8sService:
            namespace: monitoring-system
            serviceName: vmauth-monitoring-victoria-metrics-k8s-stack-internal
      toPorts:
        - ports:
            - port: "8427"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: route-traefik-metrics
  namespace: monitoring-system
  labels:
    networking.tinyrack.net/owner: monitoring
  annotations:
    networking.tinyrack.net/hosts: traefik-metrics
spec:
  description: Allow Alloy to scrape internal and external Traefik metrics
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alloy
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-system
            app.kubernetes.io/name: traefik
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik-external-system
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
