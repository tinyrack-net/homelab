# K3s component metrics share the kubelet /metrics scrape. Component job
# relabeling does not create synthetic up metrics for removed endpoints.
defaultRules:
  rules:
    KubeAPIDown: {enabled: false}
    KubeAPIInstanceUnreachable: {enabled: false}
    KubeControllerManagerDown: {enabled: false}
    KubeControllerManagerInstanceUnreachable: {enabled: false}
    KubeSchedulerDown: {enabled: false}
    KubeSchedulerInstanceUnreachable: {enabled: false}
victoria-metrics-operator:
  serviceMonitor:
    enabled: false
  operator:
    disable_prometheus_converter: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
vmcluster:
  enabled: false
vlcluster:
  enabled: false
vldistributed:
  enabled: false
vtcluster:
  enabled: false
vmagent:
  enabled: false
vlagent:
  enabled: false
vmalert:
  enabled: true
  spec:
    evaluationInterval: 30s
    selectAllByDefault: true
    disableSelfServiceScrape: true
    extraArgs:
      notifier.blackhole: "true"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
alertmanager:
  enabled: false
internal:
  vmauth:
    spec:
      disableSelfServiceScrape: true
      userNamespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring-system
      userSelector:
        matchLabels:
          monitoring.tinyrack.net/access: telemetry-write
      unauthorizedUserAccessSpec:
        url_map:
          - src_paths:
              - /api/v1/query.*
            url_prefix:
              - http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/
          - src_paths:
              - /select/logsql/.*
            url_prefix:
              - http://vlsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:9428/
      ingress:
        class_name: traefik-external
        host: telemetry.winetree94.com
        paths:
          - /opentelemetry/v1/metrics
          - /insert/opentelemetry/v1/logs
          - /insert/opentelemetry/v1/traces
        tlsHosts:
          - telemetry.winetree94.com
        tlsSecretName: letsencrypt-cert
        annotations:
          traefik.ingress.kubernetes.io/router.entrypoints: websecure,cloudflare
extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMUser
    metadata:
      name: telemetry-write
      namespace: monitoring-system
      labels:
        monitoring.tinyrack.net/access: telemetry-write
    spec:
      tokenRef:
        name: telemetry-credentials
        key: TELEMETRY_TOKEN
      targetRefs:
        - paths:
            - /opentelemetry/v1/metrics
          static:
            url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/
        - paths:
            - /insert/opentelemetry/v1/logs
          static:
            url: http://vlsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:9428/
        - paths:
            - /insert/opentelemetry/v1/traces
          static:
            url: http://vtsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:10428/
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMUser
    metadata:
      name: dev-machines-telemetry-write
      namespace: monitoring-system
      labels:
        monitoring.tinyrack.net/access: telemetry-write
    spec:
      tokenRef:
        name: telemetry-credentials
        key: DEV_MACHINES_TELEMETRY_TOKEN
      targetRefs:
        - paths:
            - /opentelemetry/v1/metrics
          static:
            url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMUser
    metadata:
      name: gpu-server-telemetry-write
      namespace: monitoring-system
      labels:
        monitoring.tinyrack.net/access: telemetry-write
    spec:
      tokenRef:
        name: telemetry-credentials
        key: GPU_SERVER_TELEMETRY_TOKEN
      targetRefs:
        - paths:
            - /opentelemetry/v1/metrics
          static:
            url: http://vmsingle-monitoring-victoria-metrics-k8s-stack.monitoring-system.svc.cluster.local.:8428/
prometheus-node-exporter:
  enabled: false
kubelet:
  enabled: false
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false
kube-state-metrics:
  enabled: false
vmsingle:
  enabled: true
  spec:
    disableSelfServiceScrape: true
    retentionPeriod: 30d
    extraArgs:
      opentelemetry.usePrometheusNaming: "true"
      maxConcurrentInserts: "4"
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    storage:
      storageClassName: longhorn-strict-local
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 30Gi
vlsingle:
  enabled: true
  spec:
    disableSelfServiceScrape: true
    retentionPeriod: 7d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storage:
      storageClassName: longhorn-strict-local
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 40Gi
vtsingle:
  enabled: true
  spec:
    disableSelfServiceScrape: true
    retentionPeriod: 7d
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      storageClassName: longhorn-strict-local
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
defaultDashboards:
  enabled: true
  dashboards:
    # Vendored below so selectors follow real K3s component metrics, not removed up.
    apiserver:
      enabled: false
    victoriametrics-vmalert:
      enabled: false
    node-exporter-full:
      enabled: false
  sources:
    node-exporter-full:
      enabled: false
defaultDatasources:
  victorialogs:
    datasources:
      - name: VictoriaLogs (DS)
        access: proxy
        uid: VictoriaLogs
        type: victoriametrics-logs-datasource
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: trace_id
              matcherType: regex
              matcherRegex: '(?:00-|"?trace_id"?\s*[=:]\s*"?)([0-9a-fA-F]{32})(?:-[0-9a-fA-F]{16}-[0-9a-fA-F]{2})?'
              url: '${__value.raw}'
              urlDisplayLabel: View trace
              datasourceUid: VictoriaTraces
  victoriatraces:
    datasources:
      - name: VictoriaTraces
        access: proxy
        uid: VictoriaTraces
        type: jaeger
        jsonData:
          nodeGraph:
            enabled: true
          traceIdTimeParams:
            enabled: true
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            filterByTraceID: true
            filterBySpanID: false
          tracesToMetrics:
            datasourceUid: VictoriaMetrics
            spanStartTimeShift: -1m
            spanEndTimeShift: 1m
            tags:
              - key: service.name
                value: service_name
              - key: span.name
                value: span_name
            queries:
              - name: Request rate
                query: 'sum(rate(traces_span_metrics_calls_total{$$__tags}[5m]))'
              - name: Error rate
                query: 'sum(rate(traces_span_metrics_calls_total{$$__tags,status_code="STATUS_CODE_ERROR"}[5m]))'
grafana:
  enabled: true
  vmScrape:
    enabled: false
  imageRenderer:
    enabled: true
    image:
      tag: v5.12.3
      pullPolicy: IfNotPresent
    env:
      HTTP_HOST: 0.0.0.0
      XDG_CONFIG_HOME: /tmp/.chromium
      XDG_CACHE_HOME: /tmp/.chromium
      HOME: /tmp
      BROWSER_READINESS_GIVE_UP_ON_ALL_QUERIES: 30s
      BROWSER_READINESS_NETWORK_IDLE_TIMEOUT: 10s
      BROWSER_READINESS_DOM_HASHCODE_TIMEOUT: 10s
      BROWSER_MIN_WIDTH: "320"
    containerSecurityContext:
      readOnlyRootFilesystem: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "2"
        memory: 1Gi
  plugins:
    - victoriametrics-metrics-datasource
    - victoriametrics-logs-datasource
  sidecar:
    dashboards:
      multicluster: true
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  envFromSecret: grafana-env
  envValueFrom:
    GF_DATABASE_USER:
      secretKeyRef:
        name: grafana-database-user-secret
        key: username
    GF_DATABASE_PASSWORD:
      secretKeyRef:
        name: grafana-database-user-secret
        key: password
  podAnnotations:
    # Bump whenever grafana-env is resealed so environment variables are reloaded.
    monitoring.tinyrack.net/credentials-revision: "2026-09-08-1"
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  testFramework:
    enabled: false
  grafana.ini:
    analytics:
      check_for_updates: false
      reporting_enabled: false
    database:
      type: postgres
      host: grafana-database-cluster-rw.monitoring-system.svc.cluster.local:5432
      name: grafana
      ssl_mode: disable
    server:
      domain: monitor.winetree94.com
      root_url: https://monitor.winetree94.com
    auth:
      disable_login_form: true
      oauth_auto_login: true
    auth.basic:
      enabled: false
    auth.generic_oauth:
      enabled: true
      name: Issuary
      allow_sign_up: true
      auto_login: true
      role_attribute_path: "email == 'admin@winetree94.com' && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: true
      skip_org_role_sync: false
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://auth.winetree94.com/oauth/authorize
      token_url: http://issuary-service.issuary-system.svc:8080/oauth/token
      api_url: http://issuary-service.issuary-system.svc:8080/oauth/userinfo
      signout_redirect_url: https://auth.winetree94.com/oauth/end_session
      use_pkce: true
    users:
      auto_assign_org: true
      auto_assign_org_role: Viewer
    smtp:
      enabled: true
      host: mail.winetree94.com:587
      user: $__env{GF_SMTP_USER}
      password: $__env{GF_SMTP_PASSWORD}
      from_address: notify@winetree94.com
      from_name: Homelab Monitoring
      startTLS_policy: MandatoryStartTLS
    unified_alerting:
      enabled: true
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: homelab-email
          receivers:
            - uid: homelab-email
              type: email
              settings:
                addresses: admin@winetree94.com;winetree94@gmail.com
                singleEmail: false
                subject: '{{`[{{ .Status | toUpper }}][{{ .GroupLabels.cluster }}] {{ .GroupLabels.alertname }} ({{ .CommonLabels.severity }})`}}'
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: homelab-email
          group_by:
            - grafana_folder
            - alertname
            - cluster
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: homelab-infrastructure
          folder: Infrastructure
          interval: 1m
          rules:
            - uid: cluster-missing
              title: Cluster telemetry missing
              condition: B
              data:
                - refId: A
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: VictoriaMetrics
                  model:
                    datasource: {type: prometheus, uid: VictoriaMetrics}
                    editorMode: code
                    expr: (((label_replace(vector(1), "cluster", "homelab", "", "") or label_replace(vector(1), "cluster", "mail-server", "", "") or label_replace(vector(1), "cluster", "tinyrack", "", "")) unless on(cluster) count by(cluster) (up{cluster=~"homelab|mail-server|tinyrack"})) or (0 * (label_replace(vector(1), "cluster", "homelab", "", "") or label_replace(vector(1), "cluster", "mail-server", "", "") or label_replace(vector(1), "cluster", "tinyrack", "", ""))))
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  relativeTimeRange: {from: 0, to: 0}
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator: {params: [0], type: gt}
                        operator: {type: and}
                        query: {params: [A]}
                        reducer: {params: [], type: last}
                        type: query
                    datasource: {type: __expr__, uid: __expr__}
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
                    expression: A
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                summary: '{{`Cluster {{ $labels.cluster }} stopped reporting telemetry`}}'
                description: '{{`Expected cluster {{ $labels.cluster }} is absent from the up metric.`}}'
              labels: {severity: critical}
            - uid: node-not-ready
              title: Kubernetes node not ready
              condition: B
              data:
                - refId: A
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: VictoriaMetrics
                  model:
                    datasource: {type: prometheus, uid: VictoriaMetrics}
                    editorMode: code
                    expr: min by(cluster,node) (kube_node_status_condition{cluster=~"homelab|mail-server|tinyrack",condition="Ready",status="true"}) == bool 0
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  relativeTimeRange: {from: 0, to: 0}
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator: {params: [0], type: gt}
                        operator: {type: and}
                        query: {params: [A]}
                        reducer: {params: [], type: last}
                        type: query
                    datasource: {type: __expr__, uid: __expr__}
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
                    expression: A
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                summary: '{{`Node {{ $labels.node }} in {{ $labels.cluster }} is not Ready`}}'
                description: '{{`Ready condition value is {{ $values.A.Value }}.`}}'
              labels: {severity: critical}
            - uid: workload-failure
              title: Kubernetes workload failure
              condition: B
              data:
                - refId: A
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: VictoriaMetrics
                  model:
                    datasource: {type: prometheus, uid: VictoriaMetrics}
                    editorMode: code
                    expr: label_replace(kube_pod_container_status_waiting_reason{cluster=~"homelab|mail-server|tinyrack",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"} > bool 0, "failure_type", "container_waiting", "", "") or label_replace((min by(cluster,namespace,pod) (kube_pod_status_ready{cluster=~"homelab|mail-server|tinyrack",condition="true"}) == bool 0) and on(cluster,namespace,pod) (max by(cluster,namespace,pod) (kube_pod_status_phase{cluster=~"homelab|mail-server|tinyrack",phase="Running"}) == 1), "failure_type", "pod_not_ready", "", "")
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  relativeTimeRange: {from: 0, to: 0}
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator: {params: [0], type: gt}
                        operator: {type: and}
                        query: {params: [A]}
                        reducer: {params: [], type: last}
                        type: query
                    datasource: {type: __expr__, uid: __expr__}
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
                    expression: A
              noDataState: OK
              execErrState: Error
              for: 10m
              annotations:
                summary: '{{`{{ $labels.cluster }}/{{ $labels.namespace }}/{{ $labels.pod }} has a workload failure`}}'
                description: '{{`Failure type={{ $labels.failure_type }}, container={{ $labels.container }}, reason={{ $labels.reason }}.`}}'
              labels: {severity: warning}
            - uid: node-resource-high
              title: Node or volume capacity high
              condition: B
              data:
                - refId: A
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: VictoriaMetrics
                  model:
                    datasource: {type: prometheus, uid: VictoriaMetrics}
                    editorMode: code
                    expr: label_replace(1 - avg by(cluster,instance) (rate(node_cpu_seconds_total{cluster=~"homelab|mail-server|tinyrack",job="node-exporter",mode="idle"}[5m])) > bool 0.90, "resource_type", "cpu", "", "") or label_replace(max by(cluster,instance) (1 - node_memory_MemAvailable_bytes{cluster=~"homelab|mail-server|tinyrack",job="node-exporter"} / node_memory_MemTotal_bytes{cluster=~"homelab|mail-server|tinyrack",job="node-exporter"}) > bool 0.90, "resource_type", "memory", "", "") or label_replace(max by(cluster,instance,device,mountpoint,fstype) (1 - node_filesystem_avail_bytes{cluster=~"homelab|mail-server|tinyrack",job="node-exporter",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{cluster=~"homelab|mail-server|tinyrack",job="node-exporter",fstype!~"tmpfs|overlay|squashfs"}) > bool 0.85, "resource_type", "filesystem", "", "") or label_replace(max by(cluster,namespace,persistentvolumeclaim) (kubelet_volume_stats_used_bytes{cluster=~"homelab|mail-server|tinyrack",job="kubelet",metrics_path="/metrics"} / kubelet_volume_stats_capacity_bytes{cluster=~"homelab|mail-server|tinyrack",job="kubelet",metrics_path="/metrics"}) > bool 0.85, "resource_type", "pvc", "", "")
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  relativeTimeRange: {from: 0, to: 0}
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator: {params: [0], type: gt}
                        operator: {type: and}
                        query: {params: [A]}
                        reducer: {params: [], type: last}
                        type: query
                    datasource: {type: __expr__, uid: __expr__}
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
                    expression: A
              noDataState: OK
              execErrState: Error
              for: 10m
              annotations:
                summary: '{{`{{ $labels.cluster }} {{ $labels.resource_type }} capacity is above threshold`}}'
                description: '{{`Instance={{ $labels.instance }}, mountpoint={{ $labels.mountpoint }}, namespace={{ $labels.namespace }}, PVC={{ $labels.persistentvolumeclaim }}.`}}'
              labels: {severity: warning}
            - uid: telemetry-pipeline-failure
              title: Telemetry pipeline failure
              condition: B
              data:
                - refId: A
                  relativeTimeRange: {from: 600, to: 0}
                  datasourceUid: VictoriaMetrics
                  model:
                    datasource: {type: prometheus, uid: VictoriaMetrics}
                    editorMode: code
                    expr: label_replace(up{cluster=~"homelab|mail-server|tinyrack",job=~"vmsingle|vlsingle|vtsingle|vmauth"} == bool 0, "failure_type", "backend_down", "", "") or label_replace(increase(otelcol_exporter_send_failed_spans_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "span_send_failed", "", "") or label_replace(increase(otelcol_exporter_enqueue_failed_spans_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "span_enqueue_failed", "", "") or label_replace(increase(otelcol_receiver_refused_spans_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "span_receiver_refused", "", "") or label_replace(increase(otelcol_processor_refused_spans_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "span_processor_refused", "", "") or label_replace(increase(otelcol_exporter_send_failed_metric_points_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "metric_send_failed", "", "") or label_replace(increase(otelcol_exporter_enqueue_failed_metric_points_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "metric_enqueue_failed", "", "") or label_replace(increase(otelcol_receiver_refused_metric_points_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "metric_receiver_refused", "", "") or label_replace(increase(otelcol_processor_refused_metric_points_total{cluster=~"homelab|mail-server|tinyrack"}[10m]) > bool 0, "failure_type", "metric_processor_refused", "", "") or label_replace(max by(cluster,instance,exporter,data_type,component_id,component_path) (otelcol_exporter_queue_size{cluster=~"homelab|mail-server|tinyrack"}) / max by(cluster,instance,exporter,data_type,component_id,component_path) (otelcol_exporter_queue_capacity{cluster=~"homelab|mail-server|tinyrack"}) > bool 0.9, "failure_type", "queue_critical", "", "")
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: A
                - refId: B
                  relativeTimeRange: {from: 0, to: 0}
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator: {params: [0], type: gt}
                        operator: {type: and}
                        query: {params: [A]}
                        reducer: {params: [], type: last}
                        type: query
                    datasource: {type: __expr__, uid: __expr__}
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: B
                    type: threshold
                    expression: A
              noDataState: OK
              execErrState: Error
              for: 5m
              annotations:
                summary: '{{`{{ $labels.cluster }} telemetry pipeline failure`}}'
                description: '{{`Failure type={{ $labels.failure_type }}, job={{ $labels.job }}, instance={{ $labels.instance }}, data type={{ $labels.data_type }}.`}}'
              labels: {severity: critical}
            - uid: node-telemetry-stale
              title: Node telemetry stale
              condition: B
              data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: VictoriaMetrics
                model:
                  datasource:
                    type: prometheus
                    uid: VictoriaMetrics
                  editorMode: code
                  expr: (time() - max by(cluster) (timestamp(node_time_seconds{cluster=~"homelab|mail-server|tinyrack",job="node-exporter"})) > bool 90) or ((label_replace(vector(1), "cluster", "homelab", "", "") or label_replace(vector(1), "cluster", "mail-server", "", "") or label_replace(vector(1), "cluster", "tinyrack", "", "")) unless on(cluster) max by(cluster) (node_time_seconds{cluster=~"homelab|mail-server|tinyrack",job="node-exporter"}))
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 0
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                  - evaluator:
                      params:
                      - 0
                      type: gt
                    operator:
                      type: and
                    query:
                      params:
                      - B
                    reducer:
                      params: []
                      type: last
                    type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: B
                  type: threshold
                  expression: A
              noDataState: OK
              execErrState: Error
              for: 2m
              annotations:
                summary: '{{`{{ $labels.cluster }} node exporter telemetry is stale or missing`}}'
                description: 'The latest node exporter sample is over 90 seconds old.'
              labels:
                severity: warning
            - uid: node-telemetry-sparse
              title: Node telemetry has gaps
              condition: B
              data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: VictoriaMetrics
                model:
                  datasource:
                    type: prometheus
