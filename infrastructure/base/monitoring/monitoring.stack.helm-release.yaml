apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring-stack
  namespace: monitoring-system
spec:
  interval: 15m
  timeout: 15m
  releaseName: monitoring
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.91.2"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics-repository
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: monitoring-stack-values
      valuesKey: values.yaml
