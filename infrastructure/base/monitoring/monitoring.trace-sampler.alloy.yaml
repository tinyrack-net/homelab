apiVersion: collectors.grafana.com/v1alpha1
kind: Alloy
metadata:
  name: monitoring-trace-sampler
  namespace: monitoring-system
spec:
  fullnameOverride: monitoring-trace-sampler
  alloy:
    configMap:
      create: true
      content: |-
        remote.kubernetes.secret "telemetry" {
          name      = "telemetry-credentials"
          namespace = "monitoring-system"
        }

        otelcol.auth.bearer "telemetry" {
          token = remote.kubernetes.secret.telemetry.data["TELEMETRY_TOKEN"]
        }

        otelcol.exporter.otlphttp "telemetry" {
          metrics_endpoint = "http://vmauth-monitoring-victoria-metrics-k8s-stack-internal.monitoring-system.svc.cluster.local:8427/opentelemetry/v1/metrics"
          traces_endpoint = "http://vmauth-monitoring-victoria-metrics-k8s-stack-internal.monitoring-system.svc.cluster.local:8427/insert/opentelemetry/v1/traces"
          client {
            endpoint = "http://vmauth-monitoring-victoria-metrics-k8s-stack-internal.monitoring-system.svc.cluster.local:8427"
            auth = otelcol.auth.bearer.telemetry.handler
            headers = {
              "X-Scope-OrgID" = convert.nonsensitive(remote.kubernetes.secret.telemetry.data["tenantId"]),
            }
          }
          retry_on_failure {
            enabled = true
            initial_interval = "5s"
            max_interval = "30s"
            max_elapsed_time = "5m"
          }
          sending_queue {
            enabled = true
          }
        }

        otelcol.processor.batch "telemetry" {
          timeout = "2s"
          send_batch_size = 8192
          send_batch_max_size = 0
          output {
            metrics = [otelcol.exporter.otlphttp.telemetry.input]
            traces = [otelcol.exporter.otlphttp.telemetry.input]
          }
        }

        otelcol.processor.k8sattributes "default" {
          passthrough = false
          extract {
            metadata = ["k8s.namespace.name","k8s.pod.name","k8s.deployment.name","k8s.statefulset.name","k8s.daemonset.name","k8s.cronjob.name","k8s.job.name","k8s.node.name","k8s.pod.uid","k8s.pod.start_time"]
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.ip"
            }
          }
          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.uid"
            }
          }
          pod_association {
            source {
              from = "connection"
            }
          }
          output {
            traces = [otelcol.processor.transform.sanitize.input]
          }
        }

        otelcol.processor.transform "sanitize" {
          error_mode = "ignore"
          trace_statements {
            context = "resource"
            statements = [
              `set(attributes["deployment.environment.name"], "production") where attributes["deployment.environment.name"] == nil`,
              `set(attributes["k8s.cluster.name"], "homelab") where attributes["k8s.cluster.name"] == nil`,
            ]
          }
          trace_statements {
            context = "span"
            statements = [
              `set(status.code, STATUS_CODE_ERROR) where attributes["http.response.status_code"] >= 500`,
              `delete_matching_keys(attributes, "^(url\\.(full|query)|http\\.(request|response)\\.header\\.(authorization|proxy-authorization|cookie|set-cookie)|db\\.(statement|query\\.text)|redis\\.(command|args)|gen_ai\\.(prompt|completion|input|output)|llm\\.(prompts|completions)|enduser\\.|user\\.)")`,
            ]
          }
          output {
            traces = [otelcol.processor.filter.health.input]
          }
        }

        otelcol.processor.filter "health" {
          error_mode = "ignore"
          traces {
            span = [
              `IsMatch(attributes["http.route"], "(?i)(^|/)(health|healthz|ready|readyz|live|livez)(/|$)")`,
              `IsMatch(attributes["url.path"], "(?i)(^|/)(health|healthz|ready|readyz|live|livez)(/|$)")`,
            ]
          }
          output {
            traces = [
              otelcol.processor.filter.span_metrics.input,
              otelcol.connector.servicegraph.default.input,
              otelcol.processor.tail_sampling.default.input,
            ]
          }
        }

        otelcol.processor.filter "span_metrics" {
          error_mode = "silent"
          traces {
            span = [`kind == 1`]
          }
          output {
            traces = [otelcol.connector.spanmetrics.default.input]
          }
        }

        otelcol.connector.spanmetrics "default" {
          dimension {
            name = "http.request.method"
          }
          dimension {
            name = "http.response.status_code"
          }
          dimension {
            name = "deployment.environment.name"
          }
          aggregation_cardinality_limit = 5000
          namespace = "traces.span.metrics"
          metrics_expiration = "15m"
          series_expiration = "15m"
          histogram {
            unit = "s"
            explicit {
              buckets = ["2ms","4ms","6ms","8ms","10ms","50ms","100ms","200ms","400ms","800ms","1s","1400ms","2s","5s","10s","15s"]
            }
          }
          output {
            metrics = [otelcol.processor.batch.telemetry.input]
          }
        }

        otelcol.connector.servicegraph "default" {
          cache_loop = "1m"
          database_name_attributes = ["db.name"]
          dimensions = [
            "deployment.environment.name",
            "k8s.cluster.name",
            "k8s.namespace.name",
            "service.version",
          ]
          latency_histogram_buckets = ["2ms","4ms","6ms","8ms","10ms","50ms","100ms","200ms","400ms","800ms","1s","1400ms","2s","5s","10s","15s"]
          metrics_flush_interval = "60s"
          store_expiration_loop = "2s"
          output {
            metrics = [otelcol.processor.batch.telemetry.input]
          }
        }

        otelcol.processor.tail_sampling "default" {
          decision_wait = "15s"
          decision_cache = {
            sampled_cache_size = 100000,
            non_sampled_cache_size = 100000,
          }
          num_traces = 10000
          expected_new_traces_per_sec = 50

          policy {
            name = "errors"
            type = "status_code"
            status_code {
              status_codes = ["ERROR"]
            }
          }
          policy {
            name = "slow-requests"
            type = "latency"
            latency {
              threshold_ms = 2000
            }
          }
          policy {
            name = "baseline"
            type = "probabilistic"
            probabilistic {
              sampling_percentage = 10
            }
          }
          output {
            traces = [otelcol.processor.batch.telemetry.input]
          }
        }

        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
            max_recv_msg_size = "4MiB"
          }
          http {
            endpoint = "0.0.0.0:4318"
            max_request_body_size = "20MiB"
          }
          output {
            traces = [otelcol.processor.k8sattributes.default.input]
          }
        }
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
        appProtocol: grpc
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
        appProtocol: http
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  controller:
    type: statefulset
    replicas: 1
