apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: victoria-backends
  namespace: monitoring-system
spec:
  namespaceSelector:
    matchNames: [monitoring-system]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [vmsingle, vlsingle, vtsingle, vmauth]
  endpoints:
    - port: http
      interval: 30s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
          targetLabel: job
