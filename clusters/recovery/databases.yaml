apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-databases
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
  interval: 10m
  path: ./recovery/overlays/production
  prune: true
  wait: true
  timeout: 60m
  sourceRef:
    kind: GitRepository
    name: flux-system
