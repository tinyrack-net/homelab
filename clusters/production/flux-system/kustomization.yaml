apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gotk-components.yaml
- gotk-sync.yaml
- image-automation.yaml
patches:
  - target:
      version: v1
      kind: Namespace
      name: flux-system
    patch: |-
      - op: add
        path: /metadata/labels/networking.tinyrack.net~1isolation
        value: enabled
